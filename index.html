<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arjun Krishna – UX/UI Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--page:#fff;--nav:#000;--navfg:#fff;--dim:#8d8d8d;--sep:#333;--ihover:#222;--face:#fff;--ink:#000;--rbg:#fff;--rfg:#000;
  --bbg:#fff;--bfg:#111;--bline:#e4e4e4;--hline:#000;--pfg:#111;--shadow:rgba(0,0,0,.15);color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--page:#0f0f10;--nav:#f4f4f4;--navfg:#111;--dim:#7a7a7a;--sep:#cfcfcf;--ihover:#e2e2e2;--face:#111;--ink:#fff;--rbg:#111;--rfg:#fff;
  --bbg:#1d1d1f;--bfg:#f2f2f2;--bline:#333;--hline:#fff;--pfg:#f2f2f2;--shadow:rgba(0,0,0,.5);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--page);transition:background .3s}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:var(--page);font-family:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden;transition:background .3s}

.dock{position:fixed;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:20}
nav{position:relative;pointer-events:auto;display:flex;align-items:center;gap:4px;background:var(--nav);border-radius:999px;padding:6px 6px 6px 10px;max-width:calc(100vw - 16px);box-shadow:0 10px 30px var(--shadow);transition:background .3s}
.link{position:relative;border:0;background:none;font:500 16px/1 "Outfit",system-ui,sans-serif;color:var(--dim);padding:14px;border-radius:999px;cursor:pointer;transition:color .25s}
.link:hover,.link.active{color:var(--navfg)}
.link.active::after{content:"";position:absolute;left:50%;bottom:6px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--navfg)}
.sep{width:1px;height:22px;background:var(--sep);margin:0 6px;opacity:.5}
.icon{width:38px;height:38px;border:0;background:none;color:var(--navfg);display:grid;place-items:center;border-radius:50%;cursor:pointer;transition:transform .2s,background .2s}
.icon:hover{background:var(--ihover);transform:translateY(-2px)}
.icon svg{width:18px;height:18px}
#theme .sun{display:none}
:root[data-theme="dark"] #theme .sun{display:block}
:root[data-theme="dark"] #theme .moon{display:none}
.resume{display:flex;align-items:center;gap:8px;margin-left:4px;background:var(--rbg);color:var(--rfg);border:0;font:600 16px/1 "Outfit",system-ui,sans-serif;padding:14px 18px;border-radius:999px;cursor:pointer;transition:transform .2s,background .3s}
.resume:hover{transform:scale(1.04)}
.resume svg{width:15px;height:15px;transition:transform .2s}.resume:hover svg{transform:translateY(2px)}

/* mascot: one shape that grows out of the bar */
.mascot{position:absolute;bottom:calc(100% - 1px);left:0;width:132px;height:48px;margin-left:-66px;pointer-events:none;will-change:transform}
.body{position:absolute;inset:0;transform-origin:50% 100%;pointer-events:none;will-change:transform}
.shape{position:absolute;inset:0;width:132px;height:48px;fill:var(--nav);display:block;transition:fill .3s}
.face{position:absolute;left:30px;top:4px;width:72px;height:42px;background:var(--face);border-radius:22px;pointer-events:auto;cursor:pointer;display:grid;place-items:center;transition:transform .25s cubic-bezier(.3,1.7,.5,1),background .3s;touch-action:manipulation;outline:none}
.face:hover{transform:scale(1.08)}.face:active{transform:scale(.92)}
.eyes{position:relative;width:46px;height:22px;display:flex;justify-content:space-between;align-items:center}
.eye{width:13px;height:21px;border-radius:4px;background:var(--ink);transition:height .12s,width .12s,background .3s}
.eyes.blink .eye,.eyes.squint .eye{height:3px}.eyes.squint .eye{width:11px}
.happy,.love{position:absolute;top:0;bottom:0;display:none;justify-content:space-between;align-items:center}
.happy{left:-7px;right:-7px}.love{left:-6px;right:-6px}
.happy svg{width:22px;height:12px;fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.love svg{width:22px;height:19px;fill:var(--ink)}
.mascot.is-happy .eye,.mascot.is-love .eye{display:none}
.mascot.is-happy .happy{display:flex}.mascot.is-love .love{display:flex}
.ha{position:absolute;font:700 11px/1 "Outfit",sans-serif;color:var(--pfg);opacity:0;pointer-events:none;transition:opacity .2s,transform .3s cubic-bezier(.3,1.8,.5,1);transform:translateY(6px) scale(.6)}
.ha.l{left:4px;top:-22px}.ha.r{right:2px;top:-26px}
.mascot.is-happy .ha{opacity:1;transform:none}
.bubble{--shift:0px;position:absolute;left:50%;bottom:58px;transform:translate(calc(-50% + var(--shift)),8px) scale(.9);width:max-content;max-width:min(260px,calc(100vw - 32px));text-align:center;white-space:normal;background:var(--bbg);color:var(--bfg);border:1px solid var(--bline);box-shadow:0 8px 22px var(--shadow);border-radius:12px;padding:10px 16px 11px;font:400 14px/1.3 "Outfit",sans-serif;opacity:0;pointer-events:none;transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1),background .3s}
.bubble::after{content:"";position:absolute;left:calc(50% - var(--shift));bottom:-5px;width:9px;height:9px;margin-left:-5px;background:var(--bbg);border-right:1px solid var(--bline);border-bottom:1px solid var(--bline);transform:rotate(45deg)}
.mascot.is-talk .bubble{opacity:1;transform:translate(calc(-50% + var(--shift)),0) scale(1)}
.mascot.is-talk .ha{opacity:0}
.p{position:fixed;left:0;top:0;pointer-events:none;z-index:10;font-family:"Outfit",sans-serif;font-weight:700;line-height:1;will-change:transform,opacity}
@media (max-width:480px){
  nav{gap:2px;padding:5px 5px 5px 8px}
  .link{padding:13px 10px;font-size:14px}
  .icon{width:34px;height:34px}.icon svg{width:18px;height:18px}
  .resume{font-size:14px;gap:6px;padding:12px 14px;margin-left:2px}
  .resume svg{width:14px;height:14px}
  .sep{margin:0 4px}
}
@media (max-width:370px){
  .link{padding:13px 7px;font-size:13px}
  .icon{width:30px;height:30px}
  .resume{font-size:0;gap:0;padding:0;width:36px;height:36px;justify-content:center}
  .resume svg{width:17px;height:17px}
  .sep{margin:0 2px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Hero (added) ===== */
:root{--text:var(--pfg);--muted:#555;--blue:#c6a66b;--btnbg:var(--pfg);--btnfg:var(--page);--tile:#F4F5F7;--hl:rgba(0,0,0,.14);--sil:#E4E7EC;--font:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif}
:root[data-theme="dark"]{--muted:#9A9A9A;--blue:#c6a66b;--tile:#1A1B1E;--hl:rgba(255,255,255,.18);--sil:#2B2D34}
html{scroll-behavior:smooth}
body{color:var(--text)}
.layer{will-change:transform}
.hero{position:relative;overflow:hidden;min-height:100svh;display:flex;align-items:center;padding:clamp(88px,12vh,140px) 0 130px}
.hwrap{position:relative;z-index:2;width:100%;max-width:1040px;margin:0 auto;padding:0 clamp(20px,5vw,40px);pointer-events:none;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);align-items:center;gap:clamp(16px,4vw,48px)}
.hcopy{max-width:560px;pointer-events:auto}
.htitle{margin:0;font-weight:500;font-size:clamp(3rem,6.6vw,5.6rem);line-height:.98;letter-spacing:-.035em}
.htitle span{display:block;color:var(--blue)}
.hsub{margin:18px 0 0;font-weight:500;font-size:clamp(1rem,1.7vw,1.3rem);letter-spacing:-.01em}
.hlede{margin:34px 0 0;max-width:34ch;font-weight:300;color:var(--muted);font-size:clamp(1rem,1.4vw,1.15rem);line-height:1.7}
.hcta{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.hbtn{display:inline-flex;align-items:center;gap:10px;height:54px;padding:0 24px;border-radius:999px;border:1.5px solid var(--text);color:var(--text);text-decoration:none;font:400 1rem/1 var(--font);transition:transform .25s,background .25s}
.hbtn svg{width:22px;height:22px;flex:none}
.hbtn.fill{background:var(--btnbg);color:var(--btnfg)}
.hbtn:hover{transform:translateY(-2px)}
.hbtn:not(.fill):hover{background:var(--tile)}
.hcopy>*{animation:up .8s cubic-bezier(.2,.8,.2,1) both}
.hcopy>:nth-child(2){animation-delay:.08s}.hcopy>:nth-child(3){animation-delay:.16s}.hcopy>:nth-child(4){animation-delay:.24s}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}


/* Mobile social tab (right edge, collapsible) */
.side{display:none;position:fixed;right:0;top:46%;z-index:19;transform:translateY(-50%);flex-direction:column;align-items:center;background:var(--nav);border-radius:22px 0 0 22px;padding:4px 4px 4px 5px;box-shadow:0 10px 30px var(--shadow);transition:background .3s}
.side-toggle{width:34px;height:34px;border:0;background:none;color:var(--navfg);display:grid;place-items:center;border-radius:50%;cursor:pointer;padding:0}
.side-toggle svg{width:18px;height:18px;transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.side.open .side-toggle svg{transform:rotate(180deg)}
.side-links{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .45s cubic-bezier(.3,1.2,.5,1),opacity .3s}
.side-links>div{overflow:hidden;min-height:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.side.open .side-links{grid-template-rows:1fr;opacity:1}
.side:not(.open) .side-links{visibility:hidden;transition:grid-template-rows .45s cubic-bezier(.3,1.2,.5,1),opacity .3s,visibility 0s .45s}
.side .icon{width:34px;height:34px}

/* Hero portrait */
.hphoto{justify-self:end;width:100%;max-width:440px;pointer-events:auto}
.hphoto img{display:block;width:100%;height:auto;-webkit-mask-image:linear-gradient(to bottom,#000 72%,transparent 99%);mask-image:linear-gradient(to bottom,#000 72%,transparent 99%);animation:photoIn 1s .2s cubic-bezier(.2,.8,.2,1) both;user-select:none;-webkit-user-drag:none}
@keyframes photoIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}

/* Background design particles */
.fx{display:block;position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.fxp{position:absolute;bottom:-60px;display:block;opacity:0;will-change:transform,opacity;animation:fxflow linear infinite}
.fxp svg{display:block;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
@keyframes fxflow{
  0%{transform:translate3d(0,0,0) rotate(0deg);opacity:0}
  10%{opacity:var(--o)}
  50%{transform:translate3d(var(--sw),-55vh,0) rotate(calc(var(--rot)*.5))}
  90%{opacity:var(--o)}
  100%{transform:translate3d(calc(var(--sw)*-.6),-115vh,0) rotate(var(--rot));opacity:0}
}


@media (max-width:860px){
  .hero{min-height:0;padding-top:clamp(56px,9vh,88px)}
  .hwrap{grid-template-columns:1fr;gap:8px}
  .hphoto{justify-self:center;max-width:270px;order:-1}
  .hcopy{max-width:none;text-align:center}
  .hlede{margin:24px auto 0}
  .hcta{justify-content:center}
  .side{display:flex;right:env(safe-area-inset-right,0px)}
  nav .soc{display:none}
  /* pet stays tucked away until the page is scrolled */
  .mascot{transition:opacity .35s,translate .45s cubic-bezier(.3,1.5,.5,1),visibility 0s}
  .mascot.away{opacity:0;visibility:hidden;translate:0 26px;transition:opacity .25s,translate .35s,visibility 0s .35s}
}
@media (prefers-reduced-motion:reduce){.fx{display:none!important}}
@media (max-width:520px){.hbtn{flex:1 1 100%;justify-content:center}}
</style>
</head>

  function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
  function clampX(v){var m=66+nav.offsetHeight/2+2;return Math.max(m,Math.min(nav.offsetWidth-m,v));}
  function activeCenter(){var a=document.querySelector('.link.active');return a?a.offsetLeft+a.offsetWidth/2:120;}
  target=clampX(activeCenter());

  /* theme */
  function setTheme(t,silent){
    root.setAttribute('data-theme',t);
    themeBtn.setAttribute('aria-label',t==='dark'?'Switch to light mode':'Switch to dark mode');
    try{localStorage.setItem('navTheme',t);}catch(e){}
    if(!silent)say(CONFIG.themeMessages[t],t==='dark'?'happy':'love',2200);
  }
  var saved=null;try{saved=localStorage.getItem('navTheme');}catch(e){}
  if(saved==='dark'||saved==='light')setTheme(saved,true);
  themeBtn.addEventListener('click',function(){setTheme(root.getAttribute('data-theme')==='dark'?'light':'dark');});
  themeBtn.addEventListener('pointerenter',function(){hoverLink=themeBtn;target=clampX(themeBtn.offsetLeft+themeBtn.offsetWidth/2);});
  themeBtn.addEventListener('pointerleave',function(){hoverLink=null;});

  window.addEventListener('pointermove',function(e){
    px=e.clientX;py=e.clientY;
    if(!hoverLink)target=clampX(e.clientX-nav.getBoundingClientRect().left);
  },{passive:true});
  window.addEventListener('resize',function(){target=clampX(target);});
  links.forEach(function(l){
    l.addEventListener('pointerenter',function(){hoverLink=l;target=clampX(l.offsetLeft+l.offsetWidth/2);});
    l.addEventListener('pointerleave',function(){hoverLink=null;});
    l.addEventListener('click',function(){
      links.forEach(function(o){o.classList.remove('active');});
      l.classList.add('active');
      if(l.dataset.page==='Home')say(CONFIG.homeMessage,'love',2200);
    });
  });

  var body=document.getElementById('body'),eyeEls=[].slice.call(eyes.querySelectorAll('.eye')),ex=0,ey=0,edx=0,lastSq=0;
  (function loop(){
    var x0=x;x+=(target-x)*0.16;var v=x-x0;
    mascot.style.transform='translateX('+x.toFixed(2)+'px)';fitBubble();
    /* head leans and squashes while it slides */
    var sk=Math.max(-2.5,Math.min(2.5,v*0.35)),sq=Math.min(0.02,Math.abs(v)*0.005);
    body.style.transform='skewX('+sk.toFixed(2)+'deg) scale('+(1+sq).toFixed(3)+','+(1-sq).toFixed(3)+')';
    var r=face.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    var dx=Math.max(-1,Math.min(1,(px-cx)/140)),dy=Math.max(-1,Math.min(1,(py-cy)/140));
    var calm=(mascot.classList.contains('is-happy')||mascot.classList.contains('is-love'))?0.3:1;
    ex+=(dx*5*calm-ex)*0.14;ey+=(dy*3*calm-ey)*0.14;edx+=(dx-edx)*0.12;
    eyes.style.transform='translate('+ex.toFixed(2)+'px,'+ey.toFixed(2)+'px)';
    /* eye on the pointer side shrinks, the far eye grows, both tilt */
    var sL=1-0.18*Math.max(0,-edx)+0.06*Math.max(0,edx),sR=1-0.18*Math.max(0,edx)+0.06*Math.max(0,-edx),rot=(edx*6).toFixed(1);
    eyeEls[0].style.transform='rotate('+rot+'deg) scale('+(sL*0.95).toFixed(3)+','+sL.toFixed(3)+')';
    eyeEls[1].style.transform='rotate('+rot+'deg) scale('+(sR*0.95).toFixed(3)+','+sR.toFixed(3)+')';
    /* fast move = quick squint, like the video */
    var now=performance.now();
    if(Math.abs(v)>7&&now-lastSq>1600){lastSq=now;eyes.classList.add('squint');setTimeout(function(){eyes.classList.remove('squint');},220);}
    requestAnimationFrame(loop);
  })();

  (function blink(){
    eyes.classList.add('blink');setTimeout(function(){eyes.classList.remove('blink');},130);
    setTimeout(blink,2200+Math.random()*2800);
  })();

  /* keep the bubble inside the screen; its width follows the text */
  function fitBubble(){
    var w=bubble.offsetWidth,l=nav.getBoundingClientRect().left+x-w/2,s=0;
    if(l<8)s=8-l;else if(l+w>innerWidth-8)s=innerWidth-8-l-w;
    bubble.style.setProperty('--shift',s.toFixed(1)+'px');
  }
  function say(text,mood,ms){
    clearTimeout(talkT);
    bubble.textContent=text;
    mascot.classList.add('is-talk');
    mascot.classList.remove('is-happy','is-love');
    if(mood)mascot.classList.add('is-'+mood);
    talkT=setTimeout(function(){mascot.classList.remove('is-talk','is-love','is-happy');},ms||CONFIG.showFor);
  }

  /* talks on its own */
  function speak(){
    if(mascot.classList.contains('away'))return;
    var i;do{i=Math.floor(Math.random()*CONFIG.messages.length);}while(i===last&&CONFIG.messages.length>1);
    last=i;var m=CONFIG.messages[i];say(m.text,m.mood,CONFIG.showFor);
  }
  (function auto(){
    setTimeout(function(){
      if(!busy&&!mascot.classList.contains('is-talk'))speak();
      auto();
    },CONFIG.minGap+Math.random()*(CONFIG.maxGap-CONFIG.minGap));
  })();
  setTimeout(speak,CONFIG.firstDelay);

  /* mobile: pet only shows once the page has been scrolled */
  var mq=window.matchMedia('(max-width:860px)'),greeted=false;
  function sync(){
    var canScroll=document.documentElement.scrollHeight-window.innerHeight>60,hide=mq.matches&&canScroll&&window.scrollY<60;
    mascot.classList.toggle('away',hide);
    if(!hide&&mq.matches&&!greeted){greeted=true;setTimeout(function(){say(CONFIG.scrollMessage,'happy',2400);},350);}
  }
  window.addEventListener('scroll',sync,{passive:true});
  window.addEventListener('resize',sync);
  sync();

  face.addEventListener('pointerenter',function(e){
    if(e.pointerType==='touch'||busy)return;
    if(!mascot.classList.contains('is-talk'))mascot.classList.add('is-happy');
  });
  face.addEventListener('pointerleave',function(){if(!mascot.classList.contains('is-talk'))mascot.classList.remove('is-happy');});

  /* tap = small outlined hearts + ha ha, flying out from behind the bar */
  var COLORS=['#ff5c7a','#ff8fa3','#ff4d6d','#ffb3c1'];
  var HEART='<svg viewBox="-2 -2 28 26" width="100%" height="100%" style="overflow:visible;display:block"><path d="M12 21C-4 11 3-1 12 5c9-6 16 6 0 16Z" fill="currentColor" style="stroke:var(--hline)" stroke-width="2" stroke-linejoin="round"/></svg>';
  function particle(txt,size,color,cx,cy,dx,dy,rot,dur){
    var el=document.createElement('span');el.className='p';
    if(txt==='\u2764'){el.innerHTML=HEART;el.style.width=el.style.height=size+'px';}else el.textContent=txt;
    el.style.fontSize=size+'px';el.style.color=color;el.style.left=cx+'px';el.style.top=cy+'px';
    document.body.appendChild(el);
    var a=el.animate([
      {transform:'translate(-50%,-50%) scale(.2) rotate(0deg)',opacity:1},
      {transform:'translate(calc(-50% + '+dx*0.7+'px),calc(-50% + '+dy*0.7+'px)) scale(1.1) rotate('+rot*0.6+'deg)',opacity:1,offset:.55},
      {transform:'translate(calc(-50% + '+dx+'px),calc(-50% + '+(dy+60)+'px)) scale(.8) rotate('+rot+'deg)',opacity:0}
    ],{duration:dur,easing:'cubic-bezier(.15,.8,.3,1)',fill:'forwards'});
    a.onfinish=function(){el.remove();};
  }
  function blast(){
    var r=face.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    for(var i=0;i<9;i++){
      var ang=-Math.PI/2+(Math.random()-.5)*Math.PI*1.5,d=40+Math.random()*80;
      particle('\u2764',10+Math.random()*7,COLORS[i%COLORS.length],cx,cy,Math.cos(ang)*d,Math.sin(ang)*d-10,(Math.random()-.5)*120,1000+Math.random()*700);
    }
    for(var j=0;j<3;j++){
      var a2=-Math.PI/2+(Math.random()-.5)*2.4,d2=60+Math.random()*90;
      particle(j%2?'ha':'ha ha',12+Math.random()*4,'var(--pfg)',cx,cy,Math.cos(a2)*d2,Math.sin(a2)*d2-30,(Math.random()-.5)*50,1100+Math.random()*500);
    }
  }
  function tap(){
    busy=true;blast();say(pick(CONFIG.tapMessages),'love',1800);
    setTimeout(function(){busy=false;},1800);
  }
  face.addEventListener('click',tap);
  face.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();tap();}});
})();
</script>
<script>
(function(){
  /* nav buttons scroll to sections, active link follows scroll */
  var links=[].slice.call(document.querySelectorAll('.link'));
  links.forEach(function(l){l.addEventListener('click',function(){
    var t=document.getElementById(l.dataset.page.toLowerCase()); if(t) t.scrollIntoView({behavior:'smooth'});
  })});
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){
      if(e.isIntersecting){links.forEach(function(l){l.classList.toggle('active',l.dataset.page.toLowerCase()===e.target.id)})}
    })},{rootMargin:'-45% 0px -50% 0px'});
    ['home','work','about'].forEach(function(id){var el=document.getElementById(id); if(el) io.observe(el)});
  }

  /* parallax */
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var layers=[].slice.call(document.querySelectorAll('.layer'));
  var mx=0,my=0,tx=0,ty=0,sy=0,run=false;
  function frame(){
    tx+=(mx-tx)*.08; ty+=(my-ty)*.08;
    var fine=window.matchMedia('(pointer:fine)').matches;
    layers.forEach(function(el){
      var sp=parseFloat(el.dataset.speed)||0, d=fine?(parseFloat(el.dataset.depth)||0):0;
      el.style.transform='translate3d('+(tx*d).toFixed(1)+'px,'+(ty*d-sp*sy).toFixed(1)+'px,0)';
    });
    if(Math.abs(mx-tx)>.001||Math.abs(my-ty)>.001){requestAnimationFrame(frame)}else{run=false}
  }
  function kick(){if(!run){run=true;requestAnimationFrame(frame)}}
  window.addEventListener('scroll',function(){sy=Math.min(window.scrollY,600);kick()},{passive:true});
  window.addEventListener('pointermove',function(e){mx=(e.clientX/window.innerWidth-.5)*2;my=(e.clientY/window.innerHeight-.5)*2;kick()},{passive:true});
  kick();
})();
</script>
<script>
/* floating design-tool particles for the background */
(function(){
  var host=document.getElementById('fx'); if(!host) return;
  var ICONS=[
    '<path d="M12 2.5l6 10-6 9-6-9z"/><circle cx="12" cy="11" r="1.4"/><path d="M12 12.4v9"/>',            /* pen tool */
    '<circle cx="3.5" cy="19" r="1.7"/><circle cx="20.5" cy="5" r="1.7"/><path d="M5 18.5C11 17 13 7 19 5.5"/>', /* bezier */
    '<path d="M5 3l14 7.5-6.2 1.9L10.5 19z"/>',                                                             /* cursor */
    '<path d="M7.5 3v18M16.5 3v18M3 7.5h18M3 16.5h18"/>',                                                    /* artboard */
    '<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 12.5l9 5 9-5"/>',                                             /* layers */
    '<circle cx="9" cy="9.5" r="5"/><circle cx="15" cy="9.5" r="5"/><circle cx="12" cy="15" r="5"/>',        /* swatches */
    '<path d="M3 19L8.5 5l5.5 14M5 14.5h7M16 19l2.5-7 2.5 7M17 17h3"/>',                                     /* Aa type */
    '<rect x="2.5" y="8" width="19" height="8" rx="1.5"/><path d="M6.5 8v3M10.5 8v4.5M14.5 8v3M18.5 8v4.5"/>', /* ruler */
    '<rect x="3" y="3" width="18" height="18" rx="2.5"/><path d="M3 9h18M9 9v12"/>',                         /* wireframe */
    '<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M10.5 18.5h3"/>',                         /* phone */
    '<circle cx="12" cy="12" r="8"/>',                                                                       /* circle */
    '<rect x="4.5" y="4.5" width="15" height="15" rx="2"/>',                                                 /* square */
    '<path d="M12 4l9 16H3z"/>',                                                                             /* triangle */
    '<path d="M12 3v6M12 15v6M3 12h6M15 12h6"/>'                                                             /* sparkle / crosshair */
  ];
  var big=innerWidth>860,N=big?30:18;
  for(var i=0;i<N;i++){
    var el=document.createElement('span'),size=(big?24:20)+Math.random()*(big?24:18),dur=16+Math.random()*14;
    el.className='fxp';
    el.innerHTML='<svg viewBox="0 0 24 24">'+ICONS[i%ICONS.length]+'</svg>';
    el.style.left=(Math.random()*90+2).toFixed(1)+'vw';
    el.style.width=el.style.height=size.toFixed(0)+'px';
    el.style.color=(i%3===0)?'var(--blue)':'var(--muted)';
    el.style.setProperty('--o',(0.22+Math.random()*0.22).toFixed(2));
    el.style.setProperty('--sw',((Math.random()<.5?-1:1)*(18+Math.random()*44)).toFixed(0)+'px');
    el.style.setProperty('--rot',((Math.random()<.5?-1:1)*(40+Math.random()*140)).toFixed(0)+'deg');
    el.style.animationDuration=dur.toFixed(1)+'s';
    el.style.animationDelay=(-Math.random()*dur).toFixed(1)+'s';
    host.appendChild(el);
  }
})();
</script>
<script>
/* mobile social tab: opens itself every 8s, folds back after 4s; tap the arrow any time */
(function(){
  var side=document.getElementById('side'),tg=document.getElementById('sideToggle'),t;
  if(!side||!tg) return;
  var COLLAPSED_MS=8000,OPEN_MS=4000;
  function isOpen(){return side.classList.contains('open');}
  function set(o){
    side.classList.toggle('open',o);
    tg.setAttribute('aria-expanded',o?'true':'false');
    tg.setAttribute('aria-label',o?'Hide social links':'Show social links');
  }
  function schedule(){clearTimeout(t);t=setTimeout(function(){set(!isOpen());schedule();},isOpen()?OPEN_MS:COLLAPSED_MS);}
  tg.addEventListener('click',function(){set(!isOpen());schedule();});
  schedule();
})();
</script>
