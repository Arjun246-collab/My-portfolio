<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Case study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('navTheme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
:root{--page:#fff;--text:#0a0a0a;--muted:#5a5d66;--tile:#f4f5f7;--hl:rgba(0,0,0,.12);--blue:#c6a66b;--shadow:rgba(0,0,0,.2);
  --font:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;--cs-bg:linear-gradient(140deg,#e2cd9f,#bd9b5b);--cs-fg:#14120d;color-scheme:light}
:root[data-theme="dark"]{--page:#0f0f10;--text:#f2f2f2;--muted:#9a9a9a;--tile:#1a1b1e;--hl:rgba(255,255,255,.14);--shadow:rgba(0,0,0,.55);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--page);color:var(--text);font-family:var(--font);line-height:1.6;overflow-x:hidden;transition:background .4s,color .4s}
a{color:inherit;text-decoration:none}
h1,h2,h3,p,dl,dd{margin:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:10px}

/* top bar */
.cs-bar{position:fixed;z-index:60;inset:0 0 auto 0;display:flex;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) clamp(16px,4vw,32px) 0;pointer-events:none}
.cs-bar>*{pointer-events:auto}
.cs-back,.cs-theme{display:inline-flex;align-items:center;gap:10px;height:46px;border-radius:99px;border:1px solid var(--hl);background:color-mix(in srgb,var(--page) 72%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--text);cursor:pointer;font:500 .95rem var(--font);transition:border-color .3s,transform .3s}
.cs-back{padding:0 20px 0 14px}.cs-theme{width:46px;justify-content:center;padding:0}
.cs-back:hover,.cs-theme:hover{border-color:var(--blue)}
.cs-back svg{width:18px;height:18px;transition:transform .35s}.cs-back:hover svg{transform:translateX(-4px)}
.cs-theme svg{width:19px;height:19px}.cs-theme .m{display:none}
[data-theme="light"] .cs-theme .m{display:block}[data-theme="light"] .cs-theme .s{display:none}

/* page transition cover (colour comes from the card you clicked) */
.cs-cover{position:fixed;inset:0;z-index:3000;background:var(--page);transition:transform .95s cubic-bezier(.76,0,.24,1)}
.cs-cover.up{transform:translateY(-100%)}
.cs-cover.down{animation:csDown .6s cubic-bezier(.76,0,.24,1) both}
@keyframes csDown{from{transform:translateY(100%)}to{transform:none}}

/* ===== hero: pinned stage, scroll drives --p (0 to 1), --m (mockups rise) and --n (stage steps back) ===== */
.cs-pin{position:relative;height:calc(100svh + 150vh)}
.cs-stage{position:sticky;top:0;height:100svh;--p:0;--m:0;--n:0}
.cs-inner{position:absolute;inset:0;overflow:hidden;background:var(--cs-bg);color:var(--cs-fg);transform-origin:50% 0;transform:scale(calc(1 - var(--n)*.06));border-radius:0 0 calc(var(--n)*36px) calc(var(--n)*36px)}
.cs-inner::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 55% at 50% 0,rgba(255,255,255,.3),transparent 72%)}
.cs-dim{position:absolute;inset:0;z-index:6;background:var(--page);opacity:calc(var(--n)*.72);pointer-events:none}
.cs-title{position:absolute;z-index:1;left:50%;top:max(15vh,92px);width:min(1180px,calc(100% - 40px));text-align:center;transform:translate(-50%,calc(var(--p)*-26vh));opacity:calc(1 - var(--p)*1.8)}
.cs-kicker{display:inline-flex;padding:7px 16px;margin-bottom:clamp(14px,2.4vh,26px);border:1px solid color-mix(in srgb,var(--cs-fg) 30%,transparent);border-radius:99px;font-size:.9rem;font-weight:500}
.cs-title h1{font-weight:600;font-size:clamp(2.6rem,8.4vw,7.6rem);line-height:.96;letter-spacing:-.05em}
.w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.08em}
.w>span{display:inline-block;transform:translateY(110%)}
.cs-in .w>span{animation:csRise .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms + 250ms)}
.cs-kicker{opacity:0}.cs-in .cs-kicker{animation:csFade .8s ease .1s both}
@keyframes csRise{from{transform:translateY(110%)}to{transform:none}}
@keyframes csFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* mockups */
.cs-mock{position:absolute;inset:0;z-index:2;pointer-events:none;perspective:1500px}
.cs-dev,.cs-ph1,.cs-pa{position:absolute}
.cs-dev{left:50%;bottom:-2vh;width:min(940px,72vw,92vh);transform-origin:50% 100%;transform:translate3d(-50%,calc((1 - var(--m))*30vh - var(--n)*18vh),0) rotateX(calc((1 - var(--m))*10deg)) scale(calc(.84 + var(--m)*.16))}
.cs-ph1{left:calc(50% + min(29vw,360px));bottom:-3vh;width:clamp(112px,min(15vw,26vh),230px);transform:translate3d(-50%,calc((1 - var(--m))*38vh - var(--n)*26vh),0) rotate(calc(-3deg + (1 - var(--m))*9deg))}
.cs-pa{left:calc(50% + var(--s,0)*min(22vw,31vh));bottom:-6vh;width:clamp(150px,min(26vw,36vh),300px);transform:translate3d(-50%,calc(((1 - var(--m))*34vh - var(--n)*20vh)*var(--k,1)),0) rotate(calc(var(--r,0)*1deg*(.5 + (1 - var(--m)))))}
.cs-pa.c{width:clamp(170px,min(29vw,40vh),330px)}
.cs-dev-in,.cs-ph-in{opacity:0}
.cs-in .cs-dev-in,.cs-in .cs-ph-in{animation:csUp 1s cubic-bezier(.2,.8,.2,1) var(--d,.35s) both}
@keyframes csUp{from{opacity:0;transform:translateY(60px) scale(.96)}to{opacity:1;transform:none}}
.cs-browser{overflow:hidden;border-radius:clamp(10px,1.6vw,18px);background:#17181c;border:1px solid rgba(255,255,255,.16);box-shadow:0 50px 90px -30px rgba(0,0,0,.55)}
.cs-chrome{display:flex;align-items:center;gap:6px;height:clamp(22px,2.6vw,32px);padding:0 12px;background:#202126}
.cs-chrome i{width:8px;height:8px;border-radius:50%;background:#5a5c66}
.cs-chrome span{margin:0 auto;max-width:50%;padding:2px 14px;border-radius:99px;background:#2b2c33;color:#9a9ca6;font-size:.7rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs-phone{padding:2.6%;border-radius:15%/7%;background:#0d0d0f;border:1px solid rgba(255,255,255,.2);box-shadow:0 50px 90px -30px rgba(0,0,0,.6)}
.cs-scr{position:relative;overflow:hidden;background:#fff}
.cs-scr.d{aspect-ratio:16/10}
.cs-scr.m{aspect-ratio:9/19.2;border-radius:12%/5.6%}
.cs-scr.m::after{content:"";position:absolute;z-index:2;top:2.2%;left:50%;width:28%;height:2.6%;margin-left:-14%;border-radius:99px;background:#0d0d0f}
.cs-scr img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.cs-sk{position:absolute;inset:0;padding:8%;display:flex;flex-direction:column;gap:3.5%;background:linear-gradient(180deg,#fff,#f1efe9)}
.cs-sk i{display:block;height:4%;border-radius:99px;background:rgba(20,18,13,.1)}
.cs-sk b{display:block;flex:1;max-height:42%;border-radius:12px;background:var(--blue)}
.cs-hint{position:absolute;z-index:4;left:50%;translate:-50% 0;bottom:calc(18px + env(safe-area-inset-bottom,0px));padding:8px 16px;border-radius:99px;background:rgba(0,0,0,.22);color:#fff;font-size:.85rem;opacity:calc(1 - var(--p)*14)}

/* ===== details sheet: slides up over the pinned hero ===== */
.cs-body{position:relative;z-index:5;margin-top:-50vh;padding-top:clamp(64px,9vw,120px);background:var(--page);border-radius:36px 36px 0 0;box-shadow:0 -40px 90px -40px var(--shadow)}
.cs-wrap{width:100%;max-width:1100px;margin:0 auto;padding:0 clamp(20px,5vw,40px)}
.cs-top{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(28px,5vw,72px);align-items:start}
.cs-lede{font-weight:500;font-size:clamp(1.5rem,3vw,2.4rem);line-height:1.22;letter-spacing:-.03em}
.cs-meta{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;border-top:1px solid var(--hl)}
.cs-meta div{min-width:0;padding:16px 0;border-bottom:1px solid var(--hl)}
.cs-meta dt{color:var(--muted);font-size:.82rem;font-weight:300}
.cs-meta dd{margin-top:2px;font-weight:500}
.cs-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.cs-tags span{padding:5px 14px;border:1px solid var(--hl);border-radius:99px;font-size:.88rem;color:var(--muted)}
.cs-live{display:inline-flex;align-items:center;margin-top:22px;height:50px;padding:0 24px;border-radius:99px;background:var(--blue);color:#14120d;font-weight:500;transition:transform .3s,box-shadow .3s}
.cs-live:hover{transform:translateY(-2px);box-shadow:0 14px 30px -12px var(--blue)}
.cs-sec{display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr);gap:clamp(20px,5vw,72px);margin-top:clamp(40px,6vw,72px);padding-top:clamp(40px,6vw,72px);border-top:1px solid var(--hl)}
.cs-num{margin-bottom:6px;color:var(--blue);font-weight:500;font-size:.9rem}
.cs-sec h2{font-weight:500;font-size:clamp(1.8rem,3.4vw,2.8rem);letter-spacing:-.035em;line-height:1.05}
.cs-sec .t p{max-width:56ch;color:var(--muted);font-weight:300;font-size:clamp(1.02rem,1.3vw,1.15rem);line-height:1.8}
.cs-sec .t p+p{margin-top:1em}
.cs-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:clamp(12px,1.6vw,20px);margin-top:clamp(40px,6vw,72px)}
.cs-stats div{padding:26px;border:1px solid var(--hl);border-radius:26px;background:var(--tile)}
.cs-stats b{display:block;font-weight:500;font-size:clamp(2.4rem,5vw,3.8rem);line-height:1;letter-spacing:-.05em;color:var(--blue)}
.cs-stats span{display:block;margin-top:10px;color:var(--muted);font-weight:300}
.cs-gal{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,1.6vw,20px);margin-top:clamp(40px,6vw,72px)}
.cs-fig{margin:0;overflow:hidden;aspect-ratio:4/3;border-radius:28px;background:var(--tile);border:1px solid var(--hl)}
.cs-fig:first-child{grid-column:1/-1;aspect-ratio:16/9}
.cs-fig img{display:block;width:100%;height:100%;object-fit:cover;transform:translateY(calc(var(--g,0)*-4%)) scale(1.1)}
.cs-next{position:relative;display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:clamp(56px,8vw,100px);padding:clamp(26px,4vw,48px);overflow:hidden;border-radius:32px;background:var(--nx,linear-gradient(140deg,#e2cd9f,#bd9b5b));color:#14120d;transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .5s}
.cs-next:hover{transform:translateY(-6px);box-shadow:0 40px 70px -34px var(--shadow)}
.cs-next small{display:block;font-weight:500;opacity:.7}
.cs-next strong{display:block;margin-top:6px;font-weight:600;font-size:clamp(1.6rem,4.4vw,3.4rem);line-height:1.02;letter-spacing:-.04em}
.cs-next i{flex:none;display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:#14120d;color:#fff;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.cs-next:hover i{transform:rotate(-45deg) scale(1.08)}
.cs-next svg{width:24px;height:24px}
.cs-end{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 32px;padding:clamp(48px,7vw,90px) 0 clamp(56px,8vw,96px)}
.cs-end p{font-weight:500;font-size:clamp(1.4rem,2.6vw,2.1rem);letter-spacing:-.03em}
.cs-js .cs-rv:not(.in){opacity:0}
.cs-rv.in{animation:csFade .9s cubic-bezier(.2,.8,.2,1) backwards}

@media (max-width:860px){
  .cs-pin{height:calc(100svh + 120vh)}
  .cs-title{top:max(13vh,84px)}
  .cs-dev{width:94vw}
  .cs-ph1{left:calc(50% + 29vw);width:clamp(92px,26vw,150px)}
  .cs-pa{left:calc(50% + var(--s,0)*min(33vw,26vh));width:clamp(120px,min(34vw,32vh),220px)}
  .cs-pa.c{width:clamp(140px,min(46vw,38vh),270px)}
  .cs-top,.cs-sec{grid-template-columns:1fr}
  .cs-gal{grid-template-columns:1fr}
  .cs-fig,.cs-fig:first-child{aspect-ratio:4/3}
}
@media (prefers-reduced-motion:reduce){
  .cs-pin{height:auto}.cs-stage{position:relative;height:100svh}.cs-body{margin-top:0}
  .cs-cover{transition:none}.cs-in .w>span,.cs-in .cs-dev-in,.cs-in .cs-ph-in,.cs-in .cs-kicker,.cs-rv.in{animation:none}
  .w>span,.cs-dev-in,.cs-ph-in,.cs-kicker{opacity:1;transform:none}
}

/* ===== device frames for website projects ("device" column: browser | laptop | tablet | tablet-portrait) ===== */
.cs-dev.dv-lap{width:min(960px,74vw,90vh);bottom:3vh}
.cs-dev.dv-tab{width:min(780px,62vw,80vh);bottom:3vh}
.cs-dev.dv-tabp{width:min(500px,46vw,62vh);bottom:3vh}
.cs-dev.dv-tab+.cs-ph1{left:calc(50% + min(25vw,300px))}
.cs-dev.dv-tabp+.cs-ph1{left:calc(50% + min(19vw,235px))}
.cs-lid{position:relative;padding:2.2% 2.2% 2.6%;border-radius:2.6% 2.6% .8% .8%/4.2% 4.2% 1.3% 1.3%;background:#0d0d0f;border:1px solid rgba(255,255,255,.2);box-shadow:0 50px 90px -30px rgba(0,0,0,.55)}
.cs-lid::before{content:"";position:absolute;top:.9%;left:50%;width:.9%;aspect-ratio:1;margin-left:-.45%;border-radius:50%;background:#2a2b31}
.cs-lid .cs-scr{border-radius:.5%}
.cs-base{position:relative;width:116%;margin-left:-8%;aspect-ratio:34/1;border-radius:0 0 42% 42%/0 0 100% 100%;background:linear-gradient(#d6d8de,#9a9da6);box-shadow:0 30px 50px -22px rgba(0,0,0,.55)}
.cs-base::after{content:"";position:absolute;top:0;left:50%;width:14%;height:42%;margin-left:-7%;border-radius:0 0 10px 10px;background:#8b8e97}
.cs-tab{position:relative;padding:3.2%;border-radius:5.2%/6.8%;background:#0d0d0f;border:1px solid rgba(255,255,255,.2);box-shadow:0 50px 90px -30px rgba(0,0,0,.6)}
.cs-tab::before{content:"";position:absolute;top:1.2%;left:50%;width:1%;aspect-ratio:1;margin-left:-.5%;border-radius:50%;background:#2a2b31}
.dv-tabp .cs-tab::before{top:1%;width:1.8%;margin-left:-.9%}
.cs-tabin{overflow:hidden;border-radius:2.2%/2.9%}
.cs-scr.t{aspect-ratio:4/3}
.cs-scr.tp{aspect-ratio:3/4}
@media (max-width:860px){
  .cs-dev.dv-lap{width:92vw}
  .cs-dev.dv-tab{width:84vw}
  .cs-dev.dv-tabp{width:62vw}
  .cs-dev.dv-tab+.cs-ph1{left:calc(50% + 27vw)}
  .cs-dev.dv-tabp+.cs-ph1{left:calc(50% + 24vw)}
}

/* ===== MOBILE HERO FIX: title and mockup flow as one centred group, so there is no empty gap between them =====
   (desktop keeps the original bottom-anchored layout; --mh is measured from the devices by fit() in the script) */
@media (max-width:860px){
  .cs-inner{display:flex;flex-direction:column;padding:calc(72px + env(safe-area-inset-top,0px)) 0 64px}
  .cs-title{position:relative;left:auto;top:auto;flex:none;width:calc(100% - 40px);margin:auto auto 0;transform:translate3d(0,calc(var(--p)*-26vh),0)}
  .cs-mock{position:relative;inset:auto;flex:none;height:var(--mh,64vw);margin:clamp(20px,3.4vh,32px) 0 auto}
  .cs-mock .cs-dev,.cs-mock .cs-pa{top:auto;bottom:0}
  .cs-mock .cs-ph1{top:auto;bottom:-12px}
  .cs-mock .cs-dev{transform-origin:50% 0;transform:translate3d(-50%,calc(var(--m)*-4vh - var(--n)*18vh),0) rotateX(calc((1 - var(--m))*6deg)) scale(calc(.92 + var(--m)*.08))}
  .cs-mock .cs-ph1{transform:translate3d(-50%,calc(var(--m)*-4vh - var(--n)*26vh),0) rotate(calc(-3deg + (1 - var(--m))*6deg))}
  .cs-mock .cs-pa{transform:translate3d(-50%,calc((var(--m)*-3vh - var(--n)*20vh)*var(--k,1)),0) rotate(calc(var(--r,0)*1deg*(.5 + (1 - var(--m)))))}
}

/* ===== SECTION 2 · SCREENS GALLERY (carousel + tap-to-project viewer) ===== */
.cs-body{padding-bottom:clamp(70px,9vw,130px)}
.cg{position:relative;--cgpad:max(clamp(20px,5vw,40px),calc((100% - 1100px)/2 + clamp(20px,5vw,40px)))}
.cg-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:clamp(22px,3.4vw,40px)}
.cg-head h2{font-weight:500;font-size:clamp(1.9rem,3.8vw,3.1rem);letter-spacing:-.04em;line-height:1.04}
.cg-head h2 em{font-style:normal;color:var(--blue)}
.cg-eye{margin:0 0 8px;color:var(--blue);font-weight:500;font-size:.9rem;letter-spacing:.04em}
.cg-ctl{display:flex;align-items:center;gap:14px;flex:none}
.cg-count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.95rem;min-width:62px;text-align:right}
.cg-count b{color:var(--text);font-weight:600}
.cg-btn{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;border:1px solid var(--hl);background:var(--tile);color:var(--text);cursor:pointer;transition:background .25s,color .25s,transform .25s,border-color .25s,opacity .25s}
.cg-btn svg{width:20px;height:20px}
.cg-btn:hover:not(:disabled){background:var(--blue);color:#14120d;border-color:var(--blue);transform:scale(1.06)}
.cg-btn:active:not(:disabled){transform:scale(.94)}
.cg-btn:disabled{opacity:.35;cursor:default}
.cg-track{display:flex;align-items:flex-start;gap:clamp(14px,2vw,24px);overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;padding:10px var(--cgpad) 8px;scroll-padding-inline:var(--cgpad);scrollbar-width:none;cursor:grab;-webkit-overflow-scrolling:touch}
.cg-track::-webkit-scrollbar{display:none}
.cg-track.drag{scroll-snap-type:none;cursor:grabbing}
.cg-track.drag .cg-card{pointer-events:none}
.cg-item{flex:none;scroll-snap-align:start}
.cg-card{--h:clamp(300px,58vh,540px);position:relative;display:block;height:var(--h);min-width:150px;padding:0;border:1px solid var(--hl);border-radius:clamp(20px,2.4vw,30px);background:var(--tile);overflow:hidden;cursor:zoom-in;appearance:none;font:inherit;color:inherit;transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .5s,border-color .35s}
.cg-card.ph{aspect-ratio:var(--ar,16/10)}
.cg-card img{display:block;height:100%;width:auto;max-width:86vw;-webkit-user-drag:none;user-select:none;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.cg-card:hover,.cg-card:focus-visible{transform:translateY(-8px);border-color:color-mix(in srgb,var(--blue) 45%,var(--hl));box-shadow:0 34px 60px -30px var(--shadow)}
.cg-card:hover img{transform:scale(1.04)}
.cg-card:focus-visible{outline:2px solid var(--blue);outline-offset:4px}
.cg-zoom{position:absolute;right:14px;bottom:14px;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:rgba(15,15,16,.62);color:#fff;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);opacity:0;transform:scale(.7);transition:opacity .3s,transform .4s cubic-bezier(.3,1.6,.5,1)}
.cg-zoom svg{width:18px;height:18px}
.cg-card:hover .cg-zoom,.cg-card:focus-visible .cg-zoom{opacity:1;transform:none}
@media (hover:none){.cg-zoom{opacity:1;transform:none}}
.cg-cap{display:flex;align-items:baseline;gap:10px;margin:14px 4px 0;font-weight:500}
.cg-cap b{color:var(--blue);font-size:.85rem;font-variant-numeric:tabular-nums}
.cg-cap span{color:var(--text)}
.cg-bar{position:relative;height:3px;margin:clamp(22px,3vw,34px) var(--cgpad) 0;border-radius:3px;background:var(--hl);overflow:hidden}
.cg-bar i{position:absolute;inset:0;border-radius:3px;background:var(--blue);transform-origin:0 50%;transform:scaleX(.2);transition:transform .25s}
.cg-hint{margin:14px var(--cgpad) 0;color:var(--muted);font-weight:300;font-size:.9rem}

/* viewer: the tapped screen flies out of the carousel and is shown on its own */
html.cg-lock,html.cg-lock body{overflow:hidden}
.cg-v{position:fixed;inset:0;z-index:300;display:grid;grid-template-rows:auto 1fr;visibility:hidden}
.cg-v.open,.cg-v.closing{visibility:visible}
.cg-vb{position:absolute;inset:0;background:rgba(8,8,10,.78);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);opacity:0;transition:opacity .45s}
.cg-v.open .cg-vb{opacity:1}

.cg-x{display:grid;place-items:center;flex:none;width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;transition:background .25s,transform .35s}

.cg-x svg{width:20px;height:20px}
.cg-vs{position:relative;z-index:1;display:grid;place-items:center;padding:12px clamp(56px,8vw,110px) calc(22px + env(safe-area-inset-bottom,0px));min-height:0;touch-action:pan-y}
.cg-vm{position:relative;transform-origin:0 0;will-change:transform;border-radius:clamp(16px,2vw,26px);overflow:hidden;box-shadow:0 50px 100px -30px rgba(0,0,0,.7);background:var(--tile)}

.cg-v.open .cg-vn{opacity:1}
.cg-vn:hover:not(:disabled){background:var(--blue);color:#14120d;transform:scale(1.08)}
.cg-vn:disabled{opacity:.25!important;cursor:default}

@media (max-width:860px){
  .cg-head{align-items:flex-start;flex-direction:column;gap:16px}

  .cg-card{--h:clamp(280px,52vh,460px)}

}
@media (prefers-reduced-motion:reduce){.cg-vb,.cg-vh,.cg-vn,.cg-card,.cg-card img{transition:none}}

/* ===== HERO SPACING FIX (desktop): the mockup is now attached right under the title, so the gap between the
   project name and the image is always small and the same, on every screen size and while you scroll.
   (Before, the title hung from the top and the mockup from the bottom, so a tall screen left a big empty gap.)
   Mobile already works this way, this makes desktop and tablet match. ===== */
@media (min-width:861px){
  .cs-inner{display:flex;flex-direction:column;padding:max(11vh,86px) 0 0}
  .cs-title{position:relative;left:auto;top:auto;flex:none;width:min(1180px,calc(100% - 40px));margin:0 auto;transform:translate3d(0,calc(var(--p)*-14vh),0)}
  .cs-mock{position:relative;inset:auto;flex:none;height:var(--mh,40vw);margin:clamp(14px,2.6vh,30px) 0 0}
  .cs-mock .cs-dev,.cs-mock .cs-pa{top:auto;bottom:0}
  .cs-mock .cs-ph1{top:auto;bottom:-5vh}
  .cs-mock .cs-dev{transform-origin:50% 0;transform:translate3d(-50%,calc((1 - var(--m))*5vh - var(--p)*14vh - var(--n)*18vh),0) rotateX(calc((1 - var(--m))*8deg)) scale(calc(.9 + var(--m)*.1))}
  .cs-mock .cs-ph1{transform:translate3d(-50%,calc((1 - var(--m))*7vh - var(--p)*14vh - var(--n)*26vh),0) rotate(calc(-3deg + (1 - var(--m))*6deg))}
  .cs-mock .cs-pa{transform:translate3d(-50%,calc(((1 - var(--m))*5vh - var(--p)*14vh - var(--n)*20vh)*var(--k,1)),0) rotate(calc(var(--r,0)*1deg*(.5 + (1 - var(--m)))))}
}

/* ===== SECTION 3 · DESIGN THINKING  (toolkit + the five-stage journey) ===== */
.dt{position:relative;margin-top:clamp(70px,10vw,140px);padding-top:clamp(60px,8vw,110px);border-top:1px solid var(--hl)}
.dt-head{max-width:760px}
.dt-head h2{font-weight:500;font-size:clamp(2.2rem,5.2vw,4.4rem);letter-spacing:-.045em;line-height:1}
.dt-head h2 em{font-style:normal;color:var(--blue)}
.dt-head p.l{margin-top:18px;max-width:56ch;color:var(--muted);font-weight:300;font-size:clamp(1.02rem,1.3vw,1.15rem);line-height:1.75}
.dt-flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:26px}
.dt-flow span{padding:7px 14px;border:1px solid var(--hl);border-radius:99px;font-size:.88rem;color:var(--muted)}
.dt-flow span:first-child{background:var(--blue);border-color:var(--blue);color:#14120d;font-weight:500}
.dt-flow i{width:14px;height:1.5px;background:var(--hl)}

/* toolkit: palette + tools */
.dt-kit{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(20px,3vw,36px);margin-top:clamp(40px,6vw,70px)}
.dt-box{padding:clamp(20px,2.4vw,30px);border:1px solid var(--hl);border-radius:30px;background:var(--tile)}
.dt-box h3{margin:0 0 4px;font-weight:500;font-size:1.15rem;letter-spacing:-.02em}
.dt-box>p{margin:0 0 18px;color:var(--muted);font-weight:300;font-size:.92rem}
.dt-pal{display:flex;gap:8px;height:clamp(200px,24vw,260px)}
.dt-sw{--c:#c6a66b;--ink:#14120d;position:relative;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:14px;border:0;border-radius:20px;background:var(--c);color:var(--ink);font:inherit;text-align:left;cursor:pointer;overflow:hidden;transition:flex .6s cubic-bezier(.2,.8,.2,1),transform .4s,box-shadow .4s;box-shadow:inset 0 0 0 1px rgba(128,128,128,.22)}
.dt-sw:hover,.dt-sw:focus-visible{flex:2.4;transform:translateY(-6px);box-shadow:0 26px 40px -22px var(--c),inset 0 0 0 1px rgba(128,128,128,.22)}
.dt-sw b{font-weight:500;font-size:.95rem;white-space:nowrap}
.dt-sw small{margin-top:2px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;opacity:.75;font-variant-numeric:tabular-nums;white-space:nowrap}
.dt-sw em{position:absolute;top:12px;right:12px;font-style:normal;font-size:.7rem;padding:3px 9px;border-radius:99px;background:var(--ink);color:var(--c);opacity:0;transform:translateY(-4px);transition:opacity .3s,transform .3s}
.dt-sw:hover em,.dt-sw:focus-visible em{opacity:1;transform:none}
.dt-tools{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.dt-tools li{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--hl);border-radius:18px;background:var(--page);transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .3s}
.dt-tools li:hover{transform:translateX(6px);border-color:color-mix(in srgb,var(--blue) 55%,var(--hl))}
.dt-tools .ic{flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:linear-gradient(140deg,color-mix(in srgb,var(--blue) 80%,#fff),var(--blue));color:#14120d;font-weight:600}
.dt-tools b{display:block;font-weight:500}
.dt-tools span{display:block;color:var(--muted);font-weight:300;font-size:.85rem}
.dt-toast{position:fixed;z-index:400;left:50%;bottom:28px;translate:-50% 30px;padding:11px 20px;border-radius:99px;background:var(--text);color:var(--page);font-size:.92rem;font-weight:500;opacity:0;pointer-events:none;transition:opacity .3s,translate .4s cubic-bezier(.2,.8,.2,1)}
.dt-toast.on{opacity:1;translate:-50% 0}

.dt-kit.one{grid-template-columns:1fr}.dt-board.one{grid-template-columns:1fr}
/* the journey: sticky rail + stages */
.dt-grid{display:grid;grid-template-columns:150px minmax(0,1fr);gap:clamp(20px,4vw,64px);margin-top:clamp(56px,8vw,110px);align-items:start}
.dt-rail{--pr:0;position:sticky;top:112px;padding-left:2px}
.dt-line{position:absolute;left:21px;top:22px;bottom:22px;width:2px;border-radius:2px;background:var(--hl);overflow:hidden}
.dt-line i{display:block;width:100%;height:calc(var(--pr)*100%);border-radius:2px;background:linear-gradient(var(--blue),color-mix(in srgb,var(--blue) 60%,#fff));box-shadow:0 0 14px var(--blue)}
.dt-rail ol{position:relative;display:grid;gap:26px;margin:0;padding:0;list-style:none}
.dt-rail a{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--muted);font-weight:400;font-size:.95rem;transition:color .3s}
.dt-rail .nd{position:relative;flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--hl);background:var(--page);font-size:.78rem;font-variant-numeric:tabular-nums;transition:background .4s,border-color .4s,color .4s,transform .5s cubic-bezier(.3,1.6,.5,1)}
.dt-rail a.done .nd{border-color:var(--blue);color:var(--blue)}
.dt-rail a.on{color:var(--text);font-weight:500}
.dt-rail a.on .nd{background:var(--blue);border-color:var(--blue);color:#14120d;transform:scale(1.14);box-shadow:0 0 0 7px color-mix(in srgb,var(--blue) 22%,transparent)}
.dt-rail a:hover .nd{border-color:var(--blue)}
.dt-stages{min-width:0;overflow-x:clip}
.dt-st{scroll-margin-top:96px;padding-bottom:clamp(70px,9vw,120px)}
.dt-st+.dt-st{padding-top:clamp(40px,6vw,80px);border-top:1px solid var(--hl)}
.dt-sh{display:flex;align-items:flex-end;gap:clamp(14px,2.4vw,28px);margin-bottom:clamp(28px,4vw,48px)}
.dt-no{font-weight:600;font-size:clamp(4.5rem,11vw,9rem);line-height:.8;letter-spacing:-.06em;color:transparent;-webkit-text-stroke:1.5px color-mix(in srgb,var(--blue) 85%,transparent)}
.dt-ph{margin:0 0 6px;color:var(--blue);font-weight:500;font-size:.88rem;letter-spacing:.1em;text-transform:uppercase}
.dt-sh h3{margin:0;font-weight:500;font-size:clamp(2.2rem,5.2vw,4.2rem);letter-spacing:-.045em;line-height:1}
.dt-tag{margin:10px 0 0;color:var(--muted);font-weight:300;font-size:clamp(1rem,1.3vw,1.15rem)}
.dt-lede{max-width:60ch;margin:0 0 clamp(26px,4vw,40px);font-weight:300;color:var(--muted);font-size:clamp(1.05rem,1.4vw,1.2rem);line-height:1.8}
.dt-lede b{color:var(--text);font-weight:500}
.dt-sub{display:flex;align-items:center;gap:12px;margin:clamp(40px,6vw,68px) 0 clamp(16px,2vw,24px);font-weight:500;font-size:1.05rem}
.dt-sub::after{content:"";flex:1;height:1px;background:var(--hl)}
.dt-sub small{color:var(--blue);font-weight:500;font-size:.8rem;letter-spacing:.1em}

.dt-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.dt-stat{padding:22px 20px;border:1px solid var(--hl);border-radius:24px;background:linear-gradient(160deg,color-mix(in srgb,var(--blue) 14%,transparent),transparent 75%)}
.dt-stat b{display:block;font-weight:500;font-size:clamp(2.2rem,4.4vw,3.4rem);line-height:1;letter-spacing:-.05em;color:var(--blue);font-variant-numeric:tabular-nums}
.dt-stat span{display:block;margin-top:8px;color:var(--muted);font-weight:300;font-size:.92rem}
.dt-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.dt-chips span{padding:6px 14px;border:1px solid var(--hl);border-radius:99px;font-size:.86rem;color:var(--muted)}

/* voices: sticky notes pinned on a board */
.dt-board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(16px,2.4vw,28px);padding:clamp(18px,3vw,36px);border:1px solid var(--hl);border-radius:34px;background:radial-gradient(circle at 1px 1px,var(--hl) 1px,transparent 1.5px) 0 0/22px 22px,var(--tile)}
.dt-note{position:relative;margin:0;padding:34px 24px 22px;border-radius:6px 6px 22px 6px;background:color-mix(in srgb,var(--blue) 24%,var(--page));color:var(--text);rotate:var(--r,-1.5deg);box-shadow:0 22px 30px -20px var(--shadow);transition:rotate .5s cubic-bezier(.3,1.5,.5,1),translate .5s cubic-bezier(.2,.8,.2,1),box-shadow .5s}
.dt-note:nth-child(2n){background:color-mix(in srgb,var(--blue) 12%,var(--page))}
.dt-note:hover{rotate:0deg;translate:0 -8px;box-shadow:0 34px 40px -22px var(--shadow)}
.dt-note::before{content:"";position:absolute;top:12px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--blue);box-shadow:0 3px 0 rgba(0,0,0,.25),inset -2px -2px 0 rgba(0,0,0,.18)}
.dt-note q{display:block;font-weight:400;font-size:clamp(1.02rem,1.5vw,1.25rem);line-height:1.45;quotes:"“" "”"}
.dt-note cite{display:block;margin-top:14px;font-style:normal;color:var(--muted);font-size:.85rem}
.cs-js .dt-note:not(.in){opacity:0;translate:0 26px}
.dt-note.in{animation:csFade .9s cubic-bezier(.2,.8,.2,1) backwards}

/* persona */
.dt-per{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);border:1px solid var(--hl);border-radius:34px;overflow:hidden;background:var(--tile)}
.dt-pl{position:relative;padding:clamp(24px,3vw,38px);background:linear-gradient(150deg,color-mix(in srgb,var(--blue) 70%,#fff),var(--blue) 55%,color-mix(in srgb,var(--blue) 55%,#000));color:#14120d;overflow:hidden}
.dt-pl::after{content:"";position:absolute;right:-40px;bottom:-40px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.22)}
.dt-av{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;background:#14120d;color:var(--blue);font-weight:600;font-size:2rem;box-shadow:0 0 0 6px rgba(255,255,255,.35)}
.dt-pl h4{margin:20px 0 2px;font-weight:600;font-size:1.9rem;letter-spacing:-.03em}
.dt-pl p{margin:0;font-weight:400;opacity:.8}
.dt-pl blockquote{position:relative;z-index:1;margin:22px 0 0;padding-top:18px;border-top:1px solid rgba(20,18,13,.25);font-weight:500;font-size:1.08rem;line-height:1.45}
.dt-pr{display:grid;grid-template-columns:1fr 1fr;gap:clamp(18px,2.4vw,30px);padding:clamp(24px,3vw,38px)}
.dt-pr h5{margin:0 0 12px;font-weight:500;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
.dt-pr ul{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.dt-pr li{position:relative;padding-left:22px;font-weight:300;line-height:1.5}
.dt-pr li::before{content:"";position:absolute;left:0;top:.55em;width:10px;height:10px;border-radius:50%;background:var(--blue)}
.dt-pr .x li::before{background:none;border:2px solid var(--muted);width:8px;height:8px}
.dt-pr .w{grid-column:1/-1}
.dt-pr .w .dt-chips{margin:0}

/* empathy map */
.dt-map{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dt-q{position:relative;padding:clamp(20px,2.4vw,28px);border:1px solid var(--hl);border-radius:26px;background:var(--tile);transition:transform .45s cubic-bezier(.2,.8,.2,1),border-color .3s,background .3s}
.dt-q:hover{transform:translateY(-6px);border-color:color-mix(in srgb,var(--blue) 55%,var(--hl));background:linear-gradient(160deg,color-mix(in srgb,var(--blue) 14%,var(--tile)),var(--tile))}
.dt-q h5{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-weight:500;font-size:1.05rem}
.dt-q h5 i{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--blue);color:#14120d}
.dt-q h5 svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dt-q ul{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.dt-q li{padding-left:16px;position:relative;font-weight:300;line-height:1.5;color:var(--muted)}
.dt-q li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--blue)}
.dt-q:nth-child(odd){padding-right:clamp(52px,6vw,70px)}.dt-q:nth-child(even){padding-left:clamp(52px,6vw,70px)}
.dt-core{position:absolute;z-index:2;left:50%;top:50%;translate:-50% -50%;display:grid;place-items:center;width:96px;height:96px;font-size:.95rem;border-radius:50%;background:var(--page);border:1.5px solid var(--blue);text-align:center;font-weight:500;line-height:1.15;box-shadow:0 0 0 10px color-mix(in srgb,var(--blue) 16%,transparent),0 20px 40px -18px var(--shadow)}
.dt-core small{display:block;color:var(--muted);font-weight:300;font-size:.72rem}
.cs-js .dt-map:not(.in) .dt-q{opacity:0;transform:translateY(30px)}
.cs-js .dt-map:not(.in) .dt-core{opacity:0;scale:.6}
.dt-map.in .dt-q{transition:opacity .8s calc(var(--j)*.12s),transform .9s calc(var(--j)*.12s) cubic-bezier(.2,.8,.2,1),border-color .3s,background .3s}
.dt-map .dt-core{transition:opacity .8s .5s,scale .9s .5s cubic-bezier(.3,1.6,.5,1)}

/* insight: the bridge to the next stage */
.dt-ins{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-top:clamp(40px,6vw,72px);padding:clamp(24px,3.4vw,44px);border-radius:32px;background:var(--text);color:var(--page)}
.dt-ins small{display:block;margin-bottom:10px;opacity:.6;font-weight:500;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase}
.dt-ins p{margin:0;max-width:34ch;font-weight:500;font-size:clamp(1.3rem,2.6vw,2.1rem);line-height:1.2;letter-spacing:-.03em}
.dt-ins i{flex:none;display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--blue);color:#14120d}
.dt-ins svg{width:26px;height:26px;animation:dtDown 1.8s ease-in-out infinite}
@keyframes dtDown{50%{transform:translateY(6px)}}

/* stages that are not built yet */
.dt-soon{display:grid;place-items:center;min-height:180px;border:1.5px dashed var(--hl);border-radius:28px;color:var(--muted);font-weight:300;text-align:center;padding:20px}

@media (max-width:860px){
  .dt-kit,.dt-per{grid-template-columns:1fr}
  .dt-grid{grid-template-columns:minmax(0,1fr)}
  .dt-rail{position:sticky;top:70px;z-index:20;padding:8px 10px;border:1px solid var(--hl);border-radius:99px;background:color-mix(in srgb,var(--page) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  .dt-line{left:30px;right:30px;top:auto;bottom:0;width:auto;height:2px}
  .dt-line i{width:calc(var(--pr)*100%);height:100%}
  .dt-rail ol{grid-auto-flow:column;gap:0;justify-content:space-between}
  .dt-rail a{gap:0}.dt-rail a span:not(.nd){display:none}
  .dt-rail a.on span:not(.nd){display:inline;margin-left:10px}
  .dt-rail a.on .nd{transform:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--blue) 22%,transparent)}
  .dt-rail .nd{width:36px;height:36px}
  .dt-st{scroll-margin-top:130px}
  .dt-sh{flex-direction:column;align-items:flex-start;gap:6px}
  .dt-no{font-size:4.4rem}
  .dt-board,.dt-pr,.dt-map{grid-template-columns:1fr}
  .dt-q:nth-child(odd),.dt-q:nth-child(even){padding:clamp(20px,2.4vw,28px)}
  .dt-core{position:relative;left:auto;top:auto;translate:none;margin:-4px auto;width:92px;height:92px;order:-1}
  .dt-map{display:flex;flex-direction:column}
  .dt-pal{flex-wrap:wrap;height:auto}
  .dt-sw{flex:1 1 calc(33% - 8px);height:110px}.dt-sw:hover{flex:1 1 calc(33% - 8px)}
  .dt-sw em{display:none}
  .dt-ins{flex-direction:column;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){.dt-sw,.dt-note,.dt-q,.dt-core,.dt-rail .nd{transition:none}.dt-ins svg{animation:none}}

/* ===== STAGE 2 · DEFINE  (affinity clusters, journey map, problem statement, How might we, goals) ===== */
/* affinity: notes start scattered, then settle into their themes when the block scrolls in */
.dt-aff{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}

<script>
(function(){
/* =====================================================================================
   CASE STUDY PAGE  ·  project.html?slug=your-project-slug

   1) DATA. Projects come from the Supabase table "projects" (SQL in supabase-projects.sql).
      Fill the two values below. Until then the SAMPLE projects further down are shown, so you can test the page.

   2) HOW THE MOCKUPS ARE CHOSEN (the "type" column)
        type = 'web'  website / dashboard  ->  desktop browser mockup  (desktop_image)
                                              + one phone mockup          (mobile_images[0])
        type = 'app'  mobile app           ->  PHONES ONLY, no desktop:   (mobile_images, up to 3)
                                              1 image = one big phone, 2 = a pair, 3 = a fanned trio
      If an image is missing, a neutral placeholder screen is drawn, so the layout never breaks.
      Images: upload to a public Supabase Storage bucket and paste the public URLs in the table.
        desktop_image  ~ 1600x1000 (16:10)      mobile_images ~ 1080x2300 (9:19)      gallery: any size

   3) COLOURS. The hero colour is taken automatically from your mockup image (or from the "accent" column, e.g. #3b82f6).

    stats=(T.stats||[]).filter(function(s){return s&&s.v!=null}),fd=(T.findings||[]).filter(function(f){return f&&(f.found||f.fix)}),ln=arr(T.learned).filter(Boolean);
  if(T.lede)o+='<p class="dt-lede cs-rv">'+esc(T.lede)+'</p>';
  if(arr(T.methods).length)o+='<div class="dt-chips cs-rv">'+arr(T.methods).map(function(m){return '<span>'+esc(m)+'</span>'}).join('')+'</div>';
  if(sc||stats.length)o+=sub('The numbers')+'<div class="dt-ts cs-rv">'+(sc?'<div class="dt-box dt-sc"><div class="dt-rgw"><div class="dt-rg" data-v="'+(+sc.v||0)+'" data-max="'+(+sc.max||100)+'" style="--pct:0"></div><b class="dt-rn">0</b></div><div><h3>'+esc(sc.l||'Score')+'</h3>'+(sc.note?'<p>'+esc(sc.note)+'</p>':'')+'</div></div>':'')+
    (stats.length?'<div class="dt-stats">'+stats.map(function(s){return '<div class="dt-stat"><b data-v="'+(+s.v||0)+'">0</b><span>'+esc(s.l||'')+'</span></div>'}).join('')+'</div>':'')+'</div>';
  if(fd.length)o+=sub('What I found, what I changed')+'<div class="dt-fds">'+fd.map(function(f){var sv=/^(high|medium|low)$/.test(f.sev)?f.sev:'';
    return '<div class="dt-fd cs-rv"><div class="a"><small>'+(sv?'<em class="'+sv+'">'+sv+' priority</em>':'Found')+'</small><p>'+esc(f.found||'')+'</p></div><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></i><div class="b"><small>Changed</small><p>'+esc(f.fix||'')+'</p></div></div>'}).join('')+'</div>';
  if(ln.length)o+=sub('What I learned')+'<div class="dt-ln">'+ln.map(function(t,i){return '<div class="dt-lc cs-rv"><b>'+pad2(i+1)+'</b><p>'+esc(t)+'</p></div>'}).join('')+'</div>';
  if(T.outcome)o+='<div class="dt-ins cs-rv"><div><small>Outcome</small><p>'+esc(T.outcome)+'</p></div><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.500"/></svg></i></div>';
  return o+'</article>';
}
function processHTML(p){
  var demo=!live,pr=p.process;if(typeof pr==='string'){try{pr=JSON.parse(pr)}catch(e){pr=null}}pr=pr||{};
  var E=demo?Object.assign({},DT_EMP,pr.empathize||{}):(pr.empathize&&typeof pr.empathize==='object'?pr.empathize:null);
  if(E&&!Object.keys(E).length)E=null;
  var D=demo?Object.assign({},DT_DEF,pr.define||{}):(pr.define&&typeof pr.define==='object'?pr.define:null);
  if(D&&!Object.keys(D).length)D=null;
  function stg(k,def){var v=pr[k];v=(v&&typeof v==='object')?v:null;var r=demo?Object.assign({},def,v||{}):v;return r&&Object.keys(r).length?r:null}
  var I=stg('ideate',DT_IDE),R=stg('prototype',DT_PRO),T=stg('test',DT_TES);
  var pal=dtPalette(p,demo),tl=dtTools(p,demo);
  /* which stages exist for THIS project: has data (and a renderer), or demo placeholder */
  var S={empathize:E,define:D,ideate:I,prototype:R,test:T},show=[];DT_STAGES.forEach(function(s,i){if(S[s.k])show.push({s:s,i:i,has:true})});
  if(!pal.length&&!tl.length&&!show.length)return '';
  var h='<section class="dt" id="process" aria-label="Design thinking process"><div class="cs-wrap">';
  /* intro */
  h+='<header class="dt-head cs-rv"><p class="cg-eye">Process</p><h2>Design thinking, <em>in five moves</em></h2>'+
     '<p class="l">'+esc(pr.intro||'I solve problems the way people experience them: by understanding first, framing the problem clearly, exploring widely, making it real and testing it with users.')+'</p>'+
     '<div class="dt-flow" aria-label="Stages">'+DT_STAGES.map(function(s,i){return (i?'<i></i>':'')+'<span>'+s.n+'</span>'}).join('')+'</div></header>';
  /* toolkit (each box only if it has content) */
  if(pal.length||tl.length){
    h+='<div class="dt-kit cs-rv'+(pal.length&&tl.length?'':' one')+'">'+
     (pal.length?'<div class="dt-box"><h3>Colour palette</h3><p>Hover to explore, tap a colour to copy its code.</p><div class="dt-pal">'+
       pal.map(function(c){return '<button class="dt-sw" type="button" data-hex="'+c.hex+'" style="--c:'+c.hex+';--ink:'+dtInk(c.hex)+'" aria-label="Copy '+esc(c.name)+' '+c.hex+'"><em>Copy</em><b>'+esc(c.name)+'</b><small>'+c.hex+'</small></button>'}).join('')+'</div></div>':'')+
     (tl.length?'<div class="dt-box"><h3>Tools used</h3><p>What I worked with on this project.</p><ul class="dt-tools">'+
       tl.map(function(t){return '<li><span class="ic">'+esc(String(t.name).charAt(0).toUpperCase())+'</span><div><b>'+esc(t.name)+'</b>'+(t.use?'<span>'+esc(t.use)+'</span>':'')+'</div></li>'}).join('')+'</ul></div>':'')+'</div>';
  }
  /* journey */
  if(show.length){
  h+='<div class="dt-grid"><nav class="dt-rail" aria-label="Design thinking stages"><div class="dt-line"><i></i></div><ol>'+
     show.map(function(x,k){return '<li><a href="#dt-'+(x.i+1)+'" data-i="'+k+'"><span class="nd">'+pad2(x.i+1)+'</span><span>'+x.s.n+'</span></a></li>'}).join('')+'</ol></nav><div class="dt-stages">';
  /* 01 EMPATHIZE: every block below only appears if its data exists */
  function stageHead(i,tag,sub){return '<header class="dt-sh cs-rv"><span class="dt-no">'+pad2(i+1)+'</span><div><p class="dt-ph">Stage '+['one','two','three','four','five'][i]+'</p><h3>'+DT_STAGES[i].n+'</h3><p class="dt-tag">'+esc(tag||DT_STAGES[i].tag)+'</p></div></header>'}
  function emp(E){
    var pe=E.persona&&typeof E.persona==='object'?E.persona:null,mp=E.map&&typeof E.map==='object'?E.map:null,k=0,o='';
    var mapOk=mp&&['says','thinks','does','feels'].some(function(q){return arr(mp[q]).length}),quotes=(E.quotes||[]).filter(function(q){return q&&q.q}),stats=(E.stats||[]).filter(function(s){return s&&s.v!=null});
    function sub(t){return '<div class="dt-sub cs-rv"><small>1.'+(++k)+'</small>'+t+'</div>'}
    o+='<article class="dt-st" id="dt-1">'+stageHead(0,E.tagline);
    if(E.lede)o+='<p class="dt-lede cs-rv">'+esc(E.lede)+'</p>';
    if(stats.length)o+='<div class="dt-stats cs-rv">'+stats.map(function(s){return '<div class="dt-stat"><b data-v="'+(+s.v||0)+'">0</b><span>'+esc(s.l||'')+'</span></div>'}).join('')+'</div>';
    if(arr(E.methods).length)o+='<div class="dt-chips cs-rv">'+arr(E.methods).map(function(m){return '<span>'+esc(m)+'</span>'}).join('')+'</div>';
    if(quotes.length)o+=sub('What people told me')+'<div class="dt-board'+(quotes.length===1?' one':'')+'">'+quotes.map(function(q,i){return '<figure class="dt-note cs-rv" style="--r:'+[-1.6,1.2,1.5,-1][i%4]+'deg"><q>'+esc(q.q)+'</q><cite>'+esc(q.who||'')+'</cite></figure>'}).join('')+'</div>';
    if(pe&&pe.name)o+=sub('Who I designed for')+'<div class="dt-per cs-rv"><div class="dt-pl"><div class="dt-av">'+esc(String(pe.name).charAt(0))+'</div><h4>'+esc(pe.name)+'</h4>'+(pe.meta?'<p>'+esc(pe.meta)+'</p>':'')+(pe.quote?'<blockquote>'+esc(pe.quote)+'</blockquote>':'')+'</div>'+
      '<div class="dt-pr">'+(arr(pe.goals).length?'<div><h5>Goals</h5><ul>'+dtLi(arr(pe.goals))+'</ul></div>':'')+(arr(pe.frustrations).length?'<div class="x"><h5>Frustrations</h5><ul>'+dtLi(arr(pe.frustrations))+'</ul></div>':'')+
      (arr(pe.traits).length?'<div class="w"><h5>Behaviours</h5><div class="dt-chips">'+arr(pe.traits).map(function(t){return '<span>'+esc(t)+'</span>'}).join('')+'</div></div>':'')+'</div></div>';
    if(mapOk)o+=sub('Empathy map')+'<div class="dt-map cs-rv">'+[['says','Says'],['thinks','Thinks'],['does','Does'],['feels','Feels']].map(function(q,i){return '<div class="dt-q" style="--j:'+i+'"><h5><i><svg viewBox="0 0 24 24" aria-hidden="true">'+DT_IC[q[0]]+'</svg></i>'+q[1]+'</h5><ul>'+dtLi(arr(mp[q[0]]))+'</ul></div>'}).join('')+
      '<div class="dt-core"><div>'+esc(String((pe&&pe.name)||'User').split(' ')[0])+'<small>the user</small></div></div></div>';
    if(E.insight)o+='<div class="dt-ins cs-rv"><div><small>Key insight</small><p>'+esc(E.insight)+'</p></div><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg></i></div>';
    return o+'</article>';
  }
  show.forEach(function(x){var kk=0,n=x.i+1,sub=function(t){return '<div class="dt-sub cs-rv"><small>'+n+'.'+(++kk)+'</small>'+t+'</div>'};
    if(x.s.k==='empathize')h+=emp(E);
    else if(x.s.k==='define')h+=defHTML(D,sub,stageHead);
    else if(x.s.k==='ideate')h+=ideHTML(I,sub,stageHead);
    else if(x.s.k==='prototype')h+=proHTML(R,sub,stageHead,pal[0]&&pal[0].hex);
    else h+=tesHTML(T,sub,stageHead);
  });
  return h+'</div></div></div>'+'</section>';
  }
  return h+'</div></section>';
}
function initProcess(p){
  var sec=$('process');if(!sec)return;
  var rail=sec.querySelector('.dt-rail'),links=[].slice.call(sec.querySelectorAll('.dt-rail a')),stages=[].slice.call(sec.querySelectorAll('.dt-st')),n=stages.length,raf=0;
  function tick(){raf=0;var vh=innerHeight,act=0;
    stages.forEach(function(s,i){if(s.getBoundingClientRect().top<vh*.5)act=i});
    var r=stages[act].getBoundingClientRect(),frac=Math.max(0,Math.min(1,(vh*.5-r.top)/Math.max(1,r.height)));
    var first=stages[0].getBoundingClientRect().top>vh*.5?0:n>1?Math.min(1,(act+frac)/(n-1)):frac;
    rail.style.setProperty('--pr',first.toFixed(3));
    links.forEach(function(a,i){a.classList.toggle('on',i===act&&stages[0].getBoundingClientRect().top<vh*.6);a.classList.toggle('done',i<act)})}
  function req(){if(!raf)raf=requestAnimationFrame(tick)}
  if(rail&&n){addEventListener('scroll',req,{passive:true});addEventListener('resize',req);tick()}
  links.forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();stages[+a.dataset.i].scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'})})});
  /* count-up numbers */
  var io='IntersectionObserver' in window?new IntersectionObserver(function(es){es.forEach(function(e){if(!e.isIntersecting)return;io.unobserve(e.target);var el=e.target,v=+el.dataset.v,t0=performance.now();
    if(reduce){el.textContent=v;return}
    (function f(now){var t=Math.min(1,(now-t0)/1400);el.textContent=Math.round(v*(1-Math.pow(1-t,3)));if(t<1)requestAnimationFrame(f)})(t0)})},{threshold:.6}):null;
  [].forEach.call(sec.querySelectorAll('.dt-stat b'),function(b){if(io)io.observe(b);else b.textContent=b.dataset.v});
  /* score ring */
  [].forEach.call(sec.querySelectorAll('.dt-rg'),function(rg){var num=rg.parentNode.querySelector('.dt-rn'),v=+rg.dataset.v,mx=+rg.dataset.max||100;
    function set(e){rg.style.setProperty('--pct',(v/mx*100*e).toFixed(2));num.textContent=Math.round(v*e)}
    if(reduce||!('IntersectionObserver' in window)){set(1);return}
    var o=new IntersectionObserver(function(es){if(!es[0].isIntersecting)return;o.disconnect();var t0=performance.now();(function f(now){var t=Math.min(1,(now-t0)/1600);set(1-Math.pow(1-t,3));if(t<1)requestAnimationFrame(f)})(t0)},{threshold:.6});o.observe(rg)});
  /* idea matrix: hover a name or a dot to light up the other */
  [].forEach.call(sec.querySelectorAll('.dt-mxw'),function(w){
    function clr(){[].forEach.call(w.querySelectorAll('.hl'),function(x){x.classList.remove('hl')})}
    w.addEventListener('mouseover',function(e){var t=e.target.closest('[data-i]');clr();if(t)[].forEach.call(w.querySelectorAll('[data-i="'+t.dataset.i+'"]'),function(x){x.classList.add('hl')})});
    w.addEventListener('mouseleave',clr)});
  /* copy a colour */
  var toast=document.createElement('div');toast.className='dt-toast';toast.setAttribute('role','status');document.body.appendChild(toast);var tm;
  sec.addEventListener('click',function(e){var b=e.target.closest('.dt-sw');if(!b)return;var hx=b.dataset.hex;
    function done(){toast.textContent='Copied '+hx;toast.classList.add('on');clearTimeout(tm);tm=setTimeout(function(){toast.classList.remove('on')},1600)}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(hx).then(done,done);
    else{var ta=document.createElement('textarea');ta.value=hx;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(x){}ta.remove();done()}});
}

function leave(href,bg){ /* colour wipe up from the bottom, then open the next page */
  if(reduce){location.href=href;return}
  try{sessionStorage.setItem('cs_bg',bg||'')}catch(e){}
  var c=document.createElement('div');c.className='cs-cover down';c.style.background=bg||'var(--page)';document.body.appendChild(c);
  setTimeout(function(){location.href=href},620)}

getList().then(function(list){
  list=(Array.isArray(list)?list:SAMPLE).filter(function(x){return x&&x.slug});
  var slug=new URLSearchParams(location.search).get('slug'),p=list.filter(function(x){return x.slug===slug})[0]||(slug?null:list[0]);
  if(!p){$('h1').innerHTML='Project not found';$('body').innerHTML='<div class="cs-wrap"><div class="cs-end"><p>This case study does not exist (yet).</p><a class="cs-live" style="margin:0" href="'+CFG.HOME+'">Back to projects</a></div></div>';return start(null)}
  document.title=p.title+' – Case study';
  $('kicker').textContent=[p.category].filter(Boolean).join(' · ');
  $('h1').innerHTML=String(p.title).split(/\s+/).map(function(w,i){return '<span class="w"><span style="--i:'+i+'">'+esc(w)+'</span></span>'}).join(' ');
  $('mock').innerHTML=mockups(p);
  fit();addEventListener('resize',fit);
  $('body').innerHTML=bodyHTML(p)+processHTML(p);initGallery(p);initProcess(p);
  /* hero colour: accent column > colour of the mockup image > colour of the card you clicked > default gold */
  var cardBg=null;try{cardBg=sessionStorage.getItem('cs_bg')}catch(e){}
  var imgs=[p.desktop_image].concat(arr(p.mobile_images)).map(url).filter(Boolean).slice(0,4),img=imgs[0],ac=hexHsl(p.accent);
  if(ac)applyGrad(grad(ac));
  else if(cardBg&&!img){var m=/rgb\((\d+),\s*(\d+),\s*(\d+)/.exec(cardBg);$('stage').style.setProperty('--cs-bg',cardBg);if(m)$('stage').style.setProperty('--cs-fg',hsl(+m[1],+m[2],+m[3])[2]>.55?'#14120d':'#fff')}
  var ready=imgs.length&&!ac?Promise.race([tintBest(imgs).then(function(c){if(c)applyGrad(grad(c))}),new Promise(function(r){setTimeout(r,1100)})]):Promise.resolve();
  ready.then(function(){start(p)});
});

function start(p){
  try{sessionStorage.removeItem('cs_bg')}catch(e){}
  var cover=$('cover'),figs=[].slice.call(document.querySelectorAll('.cs-fig')),stage=$('stage'),pin=$('pin');
  requestAnimationFrame(function(){cover.classList.add('up');document.body.classList.add('cs-in');setTimeout(function(){cover.remove()},1100)});
  if('IntersectionObserver' in window&&!reduce){
    document.documentElement.classList.add('cs-js');
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12,rootMargin:'0px 0px -6% 0px'});
    [].forEach.call(document.querySelectorAll('.cs-rv'),function(el){io.observe(el)});
  }
  if(reduce){stage.style.setProperty('--m',1);return}
  var q=false;
  function frame(){q=false;
    var vh=innerHeight,r=pin.getBoundingClientRect(),P=Math.max(1,pin.offsetHeight-vh),pr=Math.min(1,Math.max(0,-r.top/P));
    var m=Math.min(1,pr/.5);m=1-Math.pow(1-m,3);
    var n=Math.min(1,Math.max(0,(pr-.58)/.42));n=n*n*(3-2*n);
    stage.style.setProperty('--p',pr.toFixed(4));stage.style.setProperty('--m',m.toFixed(4));stage.style.setProperty('--n',n.toFixed(4));
    figs.forEach(function(f){var b=f.getBoundingClientRect();if(b.bottom>-200&&b.top<vh+200)f.style.setProperty('--g',Math.max(-1,Math.min(1,(b.top+b.height/2-vh/2)/vh)).toFixed(3))});
  }
  function req(){if(!q){q=true;requestAnimationFrame(frame)}}
  addEventListener('scroll',req,{passive:true});addEventListener('resize',req);frame();
}

/* ---------- navigation ---------- */
document.addEventListener('click',function(e){
  var a=e.target.closest('a[data-go]');if(!a||e.metaKey||e.ctrlKey||e.shiftKey||e.button)return;
  e.preventDefault();leave(a.href,a.dataset.bg);
});
$('back').addEventListener('click',function(e){
  e.preventDefault();var same=false;try{same=document.referrer&&new URL(document.referrer).origin===location.origin}catch(x){}
  document.body.style.transition='opacity .3s';document.body.style.opacity='0';
  setTimeout(function(){if(same&&history.length>1)history.back();else location.href=CFG.HOME},reduce?0:280);
});
addEventListener('pageshow',function(e){if(e.persisted){document.body.style.opacity='';[].forEach.call(document.querySelectorAll('.cs-cover.down'),function(c){c.remove()})}});
$('theme').addEventListener('click',function(){var r=document.documentElement,t=r.getAttribute('data-theme')==='dark'?'light':'dark';r.setAttribute('data-theme',t);try{localStorage.setItem('navTheme',t)}catch(e){}});
})();
</script>
