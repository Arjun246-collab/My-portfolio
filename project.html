<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Case study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('navTheme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
:root{--page:#fff;--text:#0a0a0a;--muted:#5a5d66;--tile:#f4f5f7;--hl:rgba(0,0,0,.12);--blue:#c6a66b;--shadow:rgba(0,0,0,.2);
  --font:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;--cs-bg:linear-gradient(140deg,#e2cd9f,#bd9b5b);--cs-fg:#14120d;color-scheme:light}
:root[data-theme="dark"]{--page:#0f0f10;--text:#f2f2f2;--muted:#9a9a9a;--tile:#1a1b1e;--hl:rgba(255,255,255,.14);--shadow:rgba(0,0,0,.55);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--page);color:var(--text);font-family:var(--font);line-height:1.6;overflow-x:hidden;transition:background .4s,color .4s}
a{color:inherit;text-decoration:none}
h1,h2,h3,p,dl,dd{margin:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:10px}

/* top bar */
.cs-bar{position:fixed;z-index:60;inset:0 0 auto 0;display:flex;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) clamp(16px,4vw,32px) 0;pointer-events:none}
.cs-bar>*{pointer-events:auto}
.cs-back,.cs-theme{display:inline-flex;align-items:center;gap:10px;height:46px;border-radius:99px;border:1px solid var(--hl);background:color-mix(in srgb,var(--page) 72%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--text);cursor:pointer;font:500 .95rem var(--font);transition:border-color .3s,transform .3s}
.cs-back{padding:0 20px 0 14px}.cs-theme{width:46px;justify-content:center;padding:0}
.cs-back:hover,.cs-theme:hover{border-color:var(--blue)}
.cs-back svg{width:18px;height:18px;transition:transform .35s}.cs-back:hover svg{transform:translateX(-4px)}
.cs-theme svg{width:19px;height:19px}.cs-theme .m{display:none}
[data-theme="light"] .cs-theme .m{display:block}[data-theme="light"] .cs-theme .s{display:none}

/* page transition cover (colour comes from the card you clicked) */
.cs-cover{position:fixed;inset:0;z-index:3000;background:var(--page);transition:transform .95s cubic-bezier(.76,0,.24,1)}
.cs-cover.up{transform:translateY(-100%)}
.cs-cover.down{animation:csDown .6s cubic-bezier(.76,0,.24,1) both}
@keyframes csDown{from{transform:translateY(100%)}to{transform:none}}

/* ===== hero: pinned stage, scroll drives --p (0 to 1), --m (mockups rise) and --n (stage steps back) ===== */
.cs-pin{position:relative;height:calc(100svh + 150vh)}
.cs-stage{position:sticky;top:0;height:100svh;--p:0;--m:0;--n:0}
.cs-inner{position:absolute;inset:0;overflow:hidden;background:var(--cs-bg);color:var(--cs-fg);transform-origin:50% 0;transform:scale(calc(1 - var(--n)*.06));border-radius:0 0 calc(var(--n)*36px) calc(var(--n)*36px)}
.cs-inner::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 55% at 50% 0,rgba(255,255,255,.3),transparent 72%)}
.cs-dim{position:absolute;inset:0;z-index:6;background:var(--page);opacity:calc(var(--n)*.72);pointer-events:none}
.cs-title{position:absolute;z-index:1;left:50%;top:max(15vh,92px);width:min(1180px,calc(100% - 40px));text-align:center;transform:translate(-50%,calc(var(--p)*-26vh));opacity:calc(1 - var(--p)*1.8)}
.cs-kicker{display:inline-flex;padding:7px 16px;margin-bottom:clamp(14px,2.4vh,26px);border:1px solid color-mix(in srgb,var(--cs-fg) 30%,transparent);border-radius:99px;font-size:.9rem;font-weight:500}
.cs-title h1{font-weight:600;font-size:clamp(2.6rem,8.4vw,7.6rem);line-height:.96;letter-spacing:-.05em}
.w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.08em}
.w>span{display:inline-block;transform:translateY(110%)}
.cs-in .w>span{animation:csRise .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms + 250ms)}
.cs-kicker{opacity:0}.cs-in .cs-kicker{animation:csFade .8s ease .1s both}
@keyframes csRise{from{transform:translateY(110%)}to{transform:none}}
@keyframes csFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* mockups */
.cs-mock{position:absolute;inset:0;z-index:2;pointer-events:none;perspective:1500px}
.cs-dev,.cs-ph1,.cs-pa{position:absolute}
.cs-dev{left:50%;bottom:-2vh;width:min(940px,72vw,92vh);transform-origin:50% 100%;transform:translate3d(-50%,calc((1 - var(--m))*30vh - var(--n)*18vh),0) rotateX(calc((1 - var(--m))*10deg)) scale(calc(.84 + var(--m)*.16))}
.cs-ph1{left:calc(50% + min(29vw,360px));bottom:-3vh;width:clamp(112px,min(15vw,26vh),230px);transform:translate3d(-50%,calc((1 - var(--m))*38vh - var(--n)*26vh),0) rotate(calc(-3deg + (1 - var(--m))*9deg))}
.cs-pa{left:calc(50% + var(--s,0)*min(22vw,31vh));bottom:-6vh;width:clamp(150px,min(26vw,36vh),300px);transform:translate3d(-50%,calc(((1 - var(--m))*34vh - var(--n)*20vh)*var(--k,1)),0) rotate(calc(var(--r,0)*1deg*(.5 + (1 - var(--m)))))}
.cs-pa.c{width:clamp(170px,min(29vw,40vh),330px)}
.cs-dev-in,.cs-ph-in{opacity:0}
.cs-in .cs-dev-in,.cs-in .cs-ph-in{animation:csUp 1s cubic-bezier(.2,.8,.2,1) var(--d,.35s) both}
@keyframes csUp{from{opacity:0;transform:translateY(60px) scale(.96)}to{opacity:1;transform:none}}
.cs-browser{overflow:hidden;border-radius:clamp(10px,1.6vw,18px);background:#17181c;border:1px solid rgba(255,255,255,.16);box-shadow:0 50px 90px -30px rgba(0,0,0,.55)}
.cs-chrome{display:flex;align-items:center;gap:6px;height:clamp(22px,2.6vw,32px);padding:0 12px;background:#202126}
.cs-chrome i{width:8px;height:8px;border-radius:50%;background:#5a5c66}
.cs-chrome span{margin:0 auto;max-width:50%;padding:2px 14px;border-radius:99px;background:#2b2c33;color:#9a9ca6;font-size:.7rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs-phone{padding:2.6%;border-radius:15%/7%;background:#0d0d0f;border:1px solid rgba(255,255,255,.2);box-shadow:0 50px 90px -30px rgba(0,0,0,.6)}
.cs-scr{position:relative;overflow:hidden;background:#fff}
.cs-scr.d{aspect-ratio:16/10}
.cs-scr.m{aspect-ratio:9/19.2;border-radius:12%/5.6%}
.cs-scr.m::after{content:"";position:absolute;z-index:2;top:2.2%;left:50%;width:28%;height:2.6%;margin-left:-14%;border-radius:99px;background:#0d0d0f}
.cs-scr img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.cs-sk{position:absolute;inset:0;padding:8%;display:flex;flex-direction:column;gap:3.5%;background:linear-gradient(180deg,#fff,#f1efe9)}
.cs-sk i{display:block;height:4%;border-radius:99px;background:rgba(20,18,13,.1)}
.cs-sk b{display:block;flex:1;max-height:42%;border-radius:12px;background:var(--blue)}
.cs-hint{position:absolute;z-index:4;left:50%;translate:-50% 0;bottom:calc(18px + env(safe-area-inset-bottom,0px));padding:8px 16px;border-radius:99px;background:rgba(0,0,0,.22);color:#fff;font-size:.85rem;opacity:calc(1 - var(--p)*14)}

/* ===== details sheet: slides up over the pinned hero ===== */
.cs-body{position:relative;z-index:5;margin-top:-50vh;padding-top:clamp(64px,9vw,120px);background:var(--page);border-radius:36px 36px 0 0;box-shadow:0 -40px 90px -40px var(--shadow)}
.cs-wrap{width:100%;max-width:1100px;margin:0 auto;padding:0 clamp(20px,5vw,40px)}
.cs-top{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(28px,5vw,72px);align-items:start}
.cs-lede{font-weight:500;font-size:clamp(1.5rem,3vw,2.4rem);line-height:1.22;letter-spacing:-.03em}
.cs-meta{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;border-top:1px solid var(--hl)}
.cs-meta div{min-width:0;padding:16px 0;border-bottom:1px solid var(--hl)}
.cs-meta dt{color:var(--muted);font-size:.82rem;font-weight:300}
.cs-meta dd{margin-top:2px;font-weight:500}
.cs-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.cs-tags span{padding:5px 14px;border:1px solid var(--hl);border-radius:99px;font-size:.88rem;color:var(--muted)}
.cs-live{display:inline-flex;align-items:center;margin-top:22px;height:50px;padding:0 24px;border-radius:99px;background:var(--blue);color:#14120d;font-weight:500;transition:transform .3s,box-shadow .3s}
.cs-live:hover{transform:translateY(-2px);box-shadow:0 14px 30px -12px var(--blue)}
.cs-sec{display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr);gap:clamp(20px,5vw,72px);margin-top:clamp(40px,6vw,72px);padding-top:clamp(40px,6vw,72px);border-top:1px solid var(--hl)}
.cs-num{margin-bottom:6px;color:var(--blue);font-weight:500;font-size:.9rem}
.cs-sec h2{font-weight:500;font-size:clamp(1.8rem,3.4vw,2.8rem);letter-spacing:-.035em;line-height:1.05}
.cs-sec .t p{max-width:56ch;color:var(--muted);font-weight:300;font-size:clamp(1.02rem,1.3vw,1.15rem);line-height:1.8}
.cs-sec .t p+p{margin-top:1em}
.cs-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:clamp(12px,1.6vw,20px);margin-top:clamp(40px,6vw,72px)}
.cs-stats div{padding:26px;border:1px solid var(--hl);border-radius:26px;background:var(--tile)}
.cs-stats b{display:block;font-weight:500;font-size:clamp(2.4rem,5vw,3.8rem);line-height:1;letter-spacing:-.05em;color:var(--blue)}
.cs-stats span{display:block;margin-top:10px;color:var(--muted);font-weight:300}
.cs-gal{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,1.6vw,20px);margin-top:clamp(40px,6vw,72px)}
.cs-fig{margin:0;overflow:hidden;aspect-ratio:4/3;border-radius:28px;background:var(--tile);border:1px solid var(--hl)}
.cs-fig:first-child{grid-column:1/-1;aspect-ratio:16/9}
.cs-fig img{display:block;width:100%;height:100%;object-fit:cover;transform:translateY(calc(var(--g,0)*-4%)) scale(1.1)}
.cs-next{position:relative;display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:clamp(56px,8vw,100px);padding:clamp(26px,4vw,48px);overflow:hidden;border-radius:32px;background:var(--nx,linear-gradient(140deg,#e2cd9f,#bd9b5b));color:#14120d;transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .5s}
.cs-next:hover{transform:translateY(-6px);box-shadow:0 40px 70px -34px var(--shadow)}
.cs-next small{display:block;font-weight:500;opacity:.7}
.cs-next strong{display:block;margin-top:6px;font-weight:600;font-size:clamp(1.6rem,4.4vw,3.4rem);line-height:1.02;letter-spacing:-.04em}
.cs-next i{flex:none;display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:#14120d;color:#fff;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.cs-next:hover i{transform:rotate(-45deg) scale(1.08)}
.cs-next svg{width:24px;height:24px}
.cs-end{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 32px;padding:clamp(48px,7vw,90px) 0 clamp(56px,8vw,96px)}
.cs-end p{font-weight:500;font-size:clamp(1.4rem,2.6vw,2.1rem);letter-spacing:-.03em}
.cs-js .cs-rv:not(.in){opacity:0}
.cs-rv.in{animation:csFade .9s cubic-bezier(.2,.8,.2,1) backwards}

@media (max-width:860px){
  .cs-pin{height:calc(100svh + 120vh)}
  .cs-title{top:max(13vh,84px)}
  .cs-dev{width:94vw}
  .cs-ph1{left:calc(50% + 29vw);width:clamp(92px,26vw,150px)}
  .cs-pa{left:calc(50% + var(--s,0)*min(33vw,26vh));width:clamp(120px,min(34vw,32vh),220px)}
  .cs-pa.c{width:clamp(140px,min(46vw,38vh),270px)}
  .cs-top,.cs-sec{grid-template-columns:1fr}
  .cs-gal{grid-template-columns:1fr}
  .cs-fig,.cs-fig:first-child{aspect-ratio:4/3}
}
@media (prefers-reduced-motion:reduce){
  .cs-pin{height:auto}.cs-stage{position:relative;height:100svh}.cs-body{margin-top:0}
  .cs-cover{transition:none}.cs-in .w>span,.cs-in .cs-dev-in,.cs-in .cs-ph-in,.cs-in .cs-kicker,.cs-rv.in{animation:none}
  .w>span,.cs-dev-in,.cs-ph-in,.cs-kicker{opacity:1;transform:none}
}

/* ===== device frames for website projects ("device" column: browser | laptop | tablet | tablet-portrait) ===== */
.cs-dev.dv-lap{width:min(960px,74vw,90vh);bottom:3vh}
.cs-dev.dv-tab{width:min(780px,62vw,80vh);bottom:3vh}
.cs-dev.dv-tabp{width:min(500px,46vw,62vh);bottom:3vh}
.cs-dev.dv-tab+.cs-ph1{left:calc(50% + min(25vw,300px))}
.cs-dev.dv-tabp+.cs-ph1{left:calc(50% + min(19vw,235px))}
.cs-lid{position:relative;padding:2.2% 2.2% 2.6%;border-radius:2.6% 2.6% .8% .8%/4.2% 4.2% 1.3% 1.3%;background:#0d0d0f;border:1px solid rgba(255,255,255,.2);box-shadow:0 50px 90px -30px rgba(0,0,0,.55)}
.cs-lid::before{content:"";position:absolute;top:.9%;left:50%;width:.9%;aspect-ratio:1;margin-left:-.45%;border-radius:50%;background:#2a2b31}
.cs-lid .cs-scr{border-radius:.5%}
.cs-base{position:relative;width:116%;margin-left:-8%;aspect-ratio:34/1;border-radius:0 0 42% 42%/0 0 100% 100%;background:linear-gradient(#d6d8de,#9a9da6);box-shadow:0 30px 50px -22px rgba(0,0,0,.55)}
.cs-base::after{content:"";position:absolute;top:0;left:50%;width:14%;height:42%;margin-left:-7%;border-radius:0 0 10px 10px;background:#8b8e97}
.cs-tab{position:relative;padding:3.2%;border-radius:5.2%/6.8%;background:#0d0d0f;border:1px solid rgba(255,255,255,.2);box-shadow:0 50px 90px -30px rgba(0,0,0,.6)}
.cs-tab::before{content:"";position:absolute;top:1.2%;left:50%;width:1%;aspect-ratio:1;margin-left:-.5%;border-radius:50%;background:#2a2b31}
.dv-tabp .cs-tab::before{top:1%;width:1.8%;margin-left:-.9%}
.cs-tabin{overflow:hidden;border-radius:2.2%/2.9%}
.cs-scr.t{aspect-ratio:4/3}
.cs-scr.tp{aspect-ratio:3/4}
@media (max-width:860px){
  .cs-dev.dv-lap{width:92vw}
  .cs-dev.dv-tab{width:84vw}
  .cs-dev.dv-tabp{width:62vw}
  .cs-dev.dv-tab+.cs-ph1{left:calc(50% + 27vw)}
  .cs-dev.dv-tabp+.cs-ph1{left:calc(50% + 24vw)}
}

/* ===== MOBILE HERO FIX: title and mockup flow as one centred group, so there is no empty gap between them =====
   (desktop keeps the original bottom-anchored layout; --mh is measured from the devices by fit() in the script) */
@media (max-width:860px){
  .cs-inner{display:flex;flex-direction:column;padding:calc(72px + env(safe-area-inset-top,0px)) 0 64px}
  .cs-title{position:relative;left:auto;top:auto;flex:none;width:calc(100% - 40px);margin:auto auto 0;transform:translate3d(0,calc(var(--p)*-26vh),0)}
  .cs-mock{position:relative;inset:auto;flex:none;height:var(--mh,64vw);margin:clamp(20px,3.4vh,32px) 0 auto}
  .cs-mock .cs-dev,.cs-mock .cs-pa{top:auto;bottom:0}
  .cs-mock .cs-ph1{top:auto;bottom:-12px}
  .cs-mock .cs-dev{transform-origin:50% 0;transform:translate3d(-50%,calc(var(--m)*-4vh - var(--n)*18vh),0) rotateX(calc((1 - var(--m))*6deg)) scale(calc(.92 + var(--m)*.08))}
  .cs-mock .cs-ph1{transform:translate3d(-50%,calc(var(--m)*-4vh - var(--n)*26vh),0) rotate(calc(-3deg + (1 - var(--m))*6deg))}
  .cs-mock .cs-pa{transform:translate3d(-50%,calc((var(--m)*-3vh - var(--n)*20vh)*var(--k,1)),0) rotate(calc(var(--r,0)*1deg*(.5 + (1 - var(--m)))))}
}
</style>
</head>
<body>
<div class="cs-cover" id="cover"></div>
<script>try{var b=sessionStorage.getItem('cs_bg');if(b)document.getElementById('cover').style.background=b}catch(e){}</script>

<header class="cs-bar">
  <a class="cs-back" id="back" href="index.html#work"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>All projects</a>
  <button class="cs-theme" id="theme" type="button" aria-label="Switch between dark and light theme">
    <svg class="s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="m" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>

<main>
  <section class="cs-pin" id="pin">
    <div class="cs-stage" id="stage">
      <div class="cs-inner">
        <div class="cs-title"><p class="cs-kicker" id="kicker"></p><h1 id="h1"></h1></div>
        <div class="cs-mock" id="mock"></div>
        <div class="cs-hint">Scroll</div>
      </div>
      <div class="cs-dim"></div>
    </div>
  </section>
  <article class="cs-body" id="body"></article>
</main>

  overview:'Orbit gives teams a live view of their work, but the data was hard to read.',challenge:'Too many numbers and no clear hierarchy.',
  solution:'I mapped the questions people ask every day and designed each view around one of them.',
  results:[{value:'3x',label:'faster to find insights'}],desktop_image:'',mobile_images:[],gallery:[],accent:'#2fb59a',live_url:''},
 {slug:'calm-clinic',position:4,type:'app',title:'Calm Clinic: booking',category:'Healthcare · Mobile app',year:'2024',
  summary:'A three-tap booking flow that reduced missed appointments.',
  client:'Calm Clinic',role:'UX/UI designer',timeline:'5 weeks',tools:'Figma, Maze',tags:['Mobile','Booking','Accessibility'],
  overview:'Calm Clinic wanted booking to feel as relaxed as a visit.',challenge:'Missed appointments cost the clinic every week.',
  solution:'A three-tap flow with clear reminders and an easy way to reschedule.',
  results:[{value:'-31%',label:'missed appointments'}],desktop_image:'',mobile_images:[],gallery:[],accent:'#8b6a4a',live_url:''}
];

/* ---------- helpers ---------- */
var $=function(i){return document.getElementById(i)},reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var ESC={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return ESC[c]})}
function url(u){u=String(u||'').trim();return /^\s*(javascript|vbscript):/i.test(u)||/^\s*data:(?!image\/)/i.test(u)?'':u}
function arr(v){if(Array.isArray(v))return v;if(typeof v==='string'&&v){try{var j=JSON.parse(v);if(Array.isArray(j))return j}catch(e){}return v.split(',').map(function(s){return s.trim()}).filter(Boolean)}return[]}
function paras(t){return String(t||'').split(/\n{2,}/).filter(function(p){return p.trim()}).map(function(p){return '<p>'+esc(p.trim())+'</p>'}).join('')}
function hsl(r,g,b){r/=255;g/=255;b/=255;var mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,h=0,s=0,d=mx-mn;
  if(d){s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4);h*=60}return[h,s,l]}
function hexHsl(x){var m=/^#?([0-9a-f]{6})$/i.exec(String(x||'').trim());if(!m)return null;var n=parseInt(m[1],16);return hsl(n>>16,(n>>8)&255,n&255)}
function grad(c){var s=Math.min(c[1],.62),l=Math.min(.72,Math.max(.28,c[2]));
  var f=function(d){return 'hsl('+c[0].toFixed(0)+','+(s*100).toFixed(0)+'%,'+((l+d)*100).toFixed(0)+'%)'};
  return{bg:'linear-gradient(140deg,'+f(.07)+','+f(-.1)+')',fg:l>.55?'#14120d':'#fff'}}
function applyGrad(g){var st=$('stage');st.style.setProperty('--cs-bg',g.bg);st.style.setProperty('--cs-fg',g.fg)}
function tint(src){return new Promise(function(res){ /* dominant colour of the mockup image */
  var t=new Image();t.crossOrigin='anonymous';t.onerror=function(){res(null)};
  t.onload=function(){try{var cv=document.createElement('canvas');cv.width=cv.height=32;var cx=cv.getContext('2d',{willReadFrequently:true});cx.drawImage(t,0,0,32,32);
    var d=cx.getImageData(0,0,32,32).data,bins={},best=null,tr=0,tg=0,tb=0,c=0;
    for(var i=0;i<d.length;i+=4){if(d[i+3]<128)continue;var r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b),sat=mx?(mx-mn)/mx:0,lum=(mx+mn)/510;tr+=r;tg+=g;tb+=b;c++;
      var w=(.1+sat*sat*3)*Math.max(.1,1-Math.abs(lum-.5)*1.4),k=(r>>4)+','+(g>>4)+','+(b>>4),o=bins[k]||(bins[k]={w:0,r:0,g:0,b:0});o.w+=w;o.r+=r*w;o.g+=g*w;o.b+=b*w;if(!best||o.w>best.w)best=o}
    if(!c)return res(null);var h=hsl(best.r/best.w,best.g/best.w,best.b/best.w);if(h[1]<.12)h=hsl(tr/c,tg/c,tb/c);res(h)}catch(e){res(null)}};
  t.src=src})}

function tintBest(list){ /* colour of the main screen first; if that image is neutral (white/grey) the other uploads are used */
  return Promise.all(list.map(tint)).then(function(r){var best=null,i;
    for(i=0;i<r.length;i++){if(r[i]&&r[i][1]>=.22)return r[i]}
    r.forEach(function(c){if(c&&(!best||c[1]>best[1]))best=c});return best})}

/* ---------- data ---------- */
var live=CFG.SUPABASE_URL.indexOf('YOUR-')<0;
function getList(){
  if(!live)return Promise.resolve(SAMPLE);
  var ctl=window.AbortController?new AbortController():null,tm=setTimeout(function(){ctl&&ctl.abort()},3500);
  return fetch(CFG.SUPABASE_URL+'/rest/v1/'+CFG.TABLE+'?published=eq.true&order=position.asc&select=*',{signal:ctl&&ctl.signal,headers:{apikey:CFG.SUPABASE_ANON_KEY,Authorization:'Bearer '+CFG.SUPABASE_ANON_KEY}})
    .then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(rows){clearTimeout(tm);try{localStorage.setItem('cs_projects_v1',JSON.stringify(rows))}catch(e){}return rows})
    .catch(function(){var c=null;try{c=JSON.parse(localStorage.getItem('cs_projects_v1')||'null')}catch(e){}return c||SAMPLE});
}

/* ---------- mockups ---------- */
function screen(src,alt,cls){var u=url(src);return '<div class="cs-scr '+cls+'">'+(u?'<img src="'+esc(u)+'" alt="'+esc(alt)+'" decoding="async">':'<div class="cs-sk"><i style="width:40%"></i><b></b><i></i><i style="width:70%"></i><i style="width:55%"></i></div>')+'</div>'}
function phone(src,alt,cls,s,r,k,d){return '<div class="'+cls+'" style="--s:'+s+';--r:'+r+';--k:'+k+'"><div class="cs-ph-in" style="--d:'+d+'s"><div class="cs-phone">'+screen(src,alt,'m')+'</div></div></div>'}
function mockups(p){
  var m=arr(p.mobile_images).slice(0,3),alt=p.title;
  if(String(p.type||'').toLowerCase().trim()==='app'){      /* APP: phones only */
    if(m.length>=3)return phone(m[0],alt,'cs-pa',-1,-5,.85,.6)+phone(m[2],alt,'cs-pa',1,5,.85,.7)+phone(m[1],alt,'cs-pa c',0,0,1,.45);
    if(m.length===2)return phone(m[0],alt,'cs-pa c',-.55,-4,1,.5)+phone(m[1],alt,'cs-pa c',.55,4,1.12,.65);
    return phone(m[0],alt,'cs-pa c',0,0,1,.45);
  }
  /* WEB: the "device" column picks the frame, desktop_image is the screen */
  var dev=String(p.device||'browser').toLowerCase().trim().replace(/[\s_]+/g,'-'),main,cls;
  if(dev==='laptop'||dev==='macbook'){
    cls='dv-lap';main='<div class="cs-lap"><div class="cs-lid">'+screen(p.desktop_image,alt,'d')+'</div><div class="cs-base"></div></div>';
  }else if(dev==='tablet-portrait'||dev==='ipad-portrait'){
    cls='dv-tabp';main='<div class="cs-tab"><div class="cs-tabin">'+screen(p.desktop_image,alt,'tp')+'</div></div>';
  }else if(dev==='tablet'||dev==='ipad'||dev==='tablet-landscape'){
    cls='dv-tab';main='<div class="cs-tab"><div class="cs-tabin">'+screen(p.desktop_image,alt,'t')+'</div></div>';
  }else{
    var host=(url(p.live_url).replace(/^https?:\/\//,'').replace(/\/.*$/,''))||'yourproject.com';
    cls='dv-web';main='<div class="cs-browser"><div class="cs-chrome"><i></i><i></i><i></i><span>'+esc(host)+'</span></div>'+screen(p.desktop_image,alt,'d')+'</div>';
  }
  return '<div class="cs-dev '+cls+'"><div class="cs-dev-in">'+main+'</div></div>'+
    (m[0]?'<div class="cs-ph1"><div class="cs-ph-in" style="--d:.6s"><div class="cs-phone">'+screen(m[0],alt,'m')+'</div></div></div>':'');   /* the small phone only appears if you uploaded a mobile image */
}

/* mobile hero: height of the mockup area = tallest device, so the title sits right above it (see MOBILE HERO FIX in the CSS) */
function fit(){var m=$('mock');if(!m)return;var h=0;[].forEach.call(m.children,function(c){h=Math.max(h,c.offsetHeight)});if(h)m.style.setProperty('--mh',h+'px')}

/* ---------- page ---------- */
var ARROW='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
function nextBg(n){var c=hexHsl(n.accent);return c?grad(c).bg:'linear-gradient(140deg,#e2cd9f,#bd9b5b)'}
function bodyHTML(p,list){
  var meta=[['Client',p.client],['Role',p.role],['Timeline',p.timeline],['Tools',p.tools],['Year',p.year]].filter(function(x){return x[1]});
  var h='<div class="cs-wrap"><div class="cs-top cs-rv"><p class="cs-lede">'+esc(p.summary)+'</p><div>'+
    '<dl class="cs-meta">'+meta.map(function(x){return '<div><dt>'+x[0]+'</dt><dd>'+esc(x[1])+'</dd></div>'}).join('')+'</dl>'+
    (arr(p.tags).length?'<div class="cs-tags">'+arr(p.tags).map(function(t){return '<span>'+esc(t)+'</span>'}).join('')+'</div>':'')+
    (url(p.live_url)?'<a class="cs-live" href="'+esc(url(p.live_url))+'" target="_blank" rel="noopener">Visit live site</a>':'')+'</div></div>';
  [['Overview',p.overview],['Challenge',p.challenge],['Solution',p.solution]].filter(function(x){return x[1]}).forEach(function(x,i){
    h+='<section class="cs-sec cs-rv"><div><p class="cs-num">0'+(i+1)+'</p><h2>'+x[0]+'</h2></div><div class="t">'+paras(x[1])+'</div></section>'});
  var res=arr(p.results).filter(function(r){return r&&r.value});
  if(res.length)h+='<div class="cs-stats cs-rv">'+res.map(function(r){return '<div><b>'+esc(r.value)+'</b><span>'+esc(r.label)+'</span></div>'}).join('')+'</div>';
  var g=arr(p.gallery).map(url).filter(Boolean);
  if(g.length)h+='<div class="cs-gal">'+g.map(function(u){return '<figure class="cs-fig cs-rv"><img src="'+esc(u)+'" alt="" loading="lazy"></figure>'}).join('')+'</div>';
  var i=list.indexOf(p),n=list.length>1?list[(i+1)%list.length]:null;
  if(n)h+='<a class="cs-next cs-rv" data-go href="'+CFG.PAGE+'?slug='+encodeURIComponent(n.slug)+'" data-bg="'+esc(nextBg(n))+'" style="--nx:'+esc(nextBg(n))+'"><div><small>Next project</small><strong>'+esc(n.title)+'</strong></div><i>'+ARROW+'</i></a>';
  h+='<div class="cs-end cs-rv"><p>Have a product in mind?</p><a class="cs-live" style="margin:0" href="mailto:'+esc(CFG.EMAIL)+'">Let’s talk</a></div></div>';
  return h;
}
function leave(href,bg){ /* colour wipe up from the bottom, then open the next page */
  if(reduce){location.href=href;return}
  try{sessionStorage.setItem('cs_bg',bg||'')}catch(e){}
  var c=document.createElement('div');c.className='cs-cover down';c.style.background=bg||'var(--page)';document.body.appendChild(c);
  setTimeout(function(){location.href=href},620)}

getList().then(function(list){
  list=(Array.isArray(list)?list:SAMPLE).filter(function(x){return x&&x.slug});
  var slug=new URLSearchParams(location.search).get('slug'),p=list.filter(function(x){return x.slug===slug})[0]||(slug?null:list[0]);
  if(!p){$('h1').innerHTML='Project not found';$('body').innerHTML='<div class="cs-wrap"><div class="cs-end"><p>This case study does not exist (yet).</p><a class="cs-live" style="margin:0" href="'+CFG.HOME+'">Back to projects</a></div></div>';return start(null)}
  document.title=p.title+' – Case study';
  $('kicker').textContent=[p.category].filter(Boolean).join(' · ');
  $('h1').innerHTML=String(p.title).split(/\s+/).map(function(w,i){return '<span class="w"><span style="--i:'+i+'">'+esc(w)+'</span></span>'}).join(' ');
  $('mock').innerHTML=mockups(p);
  fit();addEventListener('resize',fit);
  $('body').innerHTML=bodyHTML(p,list);
  /* hero colour: accent column > colour of the mockup image > colour of the card you clicked > default gold */
  var cardBg=null;try{cardBg=sessionStorage.getItem('cs_bg')}catch(e){}
  var imgs=[p.desktop_image].concat(arr(p.mobile_images)).map(url).filter(Boolean).slice(0,4),img=imgs[0],ac=hexHsl(p.accent);
  if(ac)applyGrad(grad(ac));
  else if(cardBg&&!img){var m=/rgb\((\d+),\s*(\d+),\s*(\d+)/.exec(cardBg);$('stage').style.setProperty('--cs-bg',cardBg);if(m)$('stage').style.setProperty('--cs-fg',hsl(+m[1],+m[2],+m[3])[2]>.55?'#14120d':'#fff')}
  var ready=imgs.length&&!ac?Promise.race([tintBest(imgs).then(function(c){if(c)applyGrad(grad(c))}),new Promise(function(r){setTimeout(r,1100)})]):Promise.resolve();
  ready.then(function(){start(p)});
});

function start(p){
  try{sessionStorage.removeItem('cs_bg')}catch(e){}
  var cover=$('cover'),figs=[].slice.call(document.querySelectorAll('.cs-fig')),stage=$('stage'),pin=$('pin');
  requestAnimationFrame(function(){cover.classList.add('up');document.body.classList.add('cs-in');setTimeout(function(){cover.remove()},1100)});
  if('IntersectionObserver' in window&&!reduce){
    document.documentElement.classList.add('cs-js');
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12,rootMargin:'0px 0px -6% 0px'});
    [].forEach.call(document.querySelectorAll('.cs-rv'),function(el){io.observe(el)});
  }
  if(reduce){stage.style.setProperty('--m',1);return}
  var q=false;
  function frame(){q=false;
    var vh=innerHeight,r=pin.getBoundingClientRect(),P=Math.max(1,pin.offsetHeight-vh),pr=Math.min(1,Math.max(0,-r.top/P));
    var m=Math.min(1,pr/.5);m=1-Math.pow(1-m,3);
    var n=Math.min(1,Math.max(0,(pr-.58)/.42));n=n*n*(3-2*n);
    stage.style.setProperty('--p',pr.toFixed(4));stage.style.setProperty('--m',m.toFixed(4));stage.style.setProperty('--n',n.toFixed(4));
    figs.forEach(function(f){var b=f.getBoundingClientRect();if(b.bottom>-200&&b.top<vh+200)f.style.setProperty('--g',Math.max(-1,Math.min(1,(b.top+b.height/2-vh/2)/vh)).toFixed(3))});
  }
  function req(){if(!q){q=true;requestAnimationFrame(frame)}}
  addEventListener('scroll',req,{passive:true});addEventListener('resize',req);frame();
}

/* ---------- navigation ---------- */
document.addEventListener('click',function(e){
  var a=e.target.closest('a[data-go]');if(!a||e.metaKey||e.ctrlKey||e.shiftKey||e.button)return;
  e.preventDefault();leave(a.href,a.dataset.bg);
});
$('back').addEventListener('click',function(e){
  e.preventDefault();var same=false;try{same=document.referrer&&new URL(document.referrer).origin===location.origin}catch(x){}
  document.body.style.transition='opacity .3s';document.body.style.opacity='0';
  setTimeout(function(){if(same&&history.length>1)history.back();else location.href=CFG.HOME},reduce?0:280);
});
addEventListener('pageshow',function(e){if(e.persisted){document.body.style.opacity='';[].forEach.call(document.querySelectorAll('.cs-cover.down'),function(c){c.remove()})}});
$('theme').addEventListener('click',function(){var r=document.documentElement,t=r.getAttribute('data-theme')==='dark'?'light':'dark';r.setAttribute('data-theme',t);try{localStorage.setItem('navTheme',t)}catch(e){}});
})();
</script>
